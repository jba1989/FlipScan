async function proofAll() {
  const r = await api(`/projects/${current}/proof`);
  // stale chapters just need their existing fixes re-applied (instant, no model);
  // only genuinely unproofed chapters go through the LLM
  const staleN = r.chapters.filter(c => c.status === "stale").length;
  if (staleN) {
    const st = $("proofall-status");
    if (st) st.textContent = T`正在重新整理 ${staleN} 個過期的章節…`;
    try { await api(`/projects/${current}/proof/refresh-stale`, {method: "POST"}); } catch {}
  }
  const todo = r.chapters.filter(c => c.status === "unproofed");
  if (!todo.length) {
    if (staleN) renderTab("proof", window._proj);
    else alert(t("無待處理項目 — 所有章節皆已校對完成。"));
    return;
  }
  for (let i = 0; i < todo.length; i++) {
    const st = $("proofall-status");
    if (st) st.textContent = T`校對中 ${i + 1}/${todo.length}：${todo[i].title}…`;
    try {
      const { job_id } = await api(`/projects/${current}/proof/${todo[i].idx}/run`, {method: "POST"});
      await waitForJob(job_id);
    } catch (e) {
      if ($("proofall-status"))
        $("proofall-status").textContent = T`${todo[i].title} 失敗：${e.message}`;
      break;
    }
  }
  renderTab("proof", window._proj);
}

// re-read one chapter's stuck page-anchored findings from the page images
async function rereadChapter(idx, btn) {
  if (btn) { btn.disabled = true; btn.textContent = t("重新辨識中…"); }
  try {
    const { job_id } = await api(`/projects/${current}/proof/${idx}/reread-stuck`, {method: "POST"});
    const j = await waitForJob(job_id);
    const d = j.result || {};
    const s = $("proofall-status");
    if (s) s.textContent = T`已重新辨識 ${d.attempted || 0} 個：${d.rescued || 0} 個自動修正，`
      + T`${d.still_manual || 0} 個仍需手動處理`;
  } catch (e) { alert(e.message); if (btn) btn.disabled = false; return; }
  renderTab("proof", window._proj);
}
async function rereadAllStuck() {
  const r = await api(`/projects/${current}/proof`);
  // only proofed chapters that aren't stale can be re-read
  const chs = r.chapters.filter(c => c.findings != null && c.status !== "stale"
                                     && c.status !== "unproofed");
  if (!chs.length) { alert(t("沒有可重新辨識的已校對章節。")); return; }
  let rescued = 0, manual = 0, attempted = 0;
  for (let i = 0; i < chs.length; i++) {
    const st = $("proofall-status");
    if (st) st.textContent = T`正在重新辨識頁面 ${i + 1}/${chs.length}：${chs[i].title}… `
      + T`(目前已自動修正 ${rescued} 項)`;
    try {
      const { job_id } = await api(`/projects/${current}/proof/${chs[i].idx}/reread-stuck`,
                          {method: "POST"});
      const j = await waitForJob(job_id);
      const d = j.result || {};
      rescued += d.rescued || 0; manual += d.still_manual || 0; attempted += d.attempted || 0;
    } catch (e) { /* skip a chapter that errored; keep going */ }
  }
  const st = $("proofall-status");
  if (st) st.textContent = "";
  alert(T`已在 ${chs.length} 個章節中重新辨識 ${attempted} 項卡住的發現：\n`
    + T`• ${rescued} 項已從頁面影像自動修正\n`
    + T`• ${manual} 項仍需手動處理（使用 ✎ 或 👁 檢視頁面）`);
  renderTab("proof", window._proj);
}

// ---- storage & cleanup (media tab)
function fmtBytes(n) {
  if (n >= 1e9) return (n / 1e9).toFixed(2) + " GB";
  if (n >= 1e6) return (n / 1e6).toFixed(1) + " MB";
  return Math.max(1, Math.round(n / 1e3)) + " KB";
}

async function renderStorage(name) {
  const card = $("storage-card");
  if (!card) return;
  let s;
  try { s = await api(`/projects/${name}/storage`); }
  catch (e) { card.querySelector(".meta").textContent = e.message; return; }
  const catRow = (key, c) => c.count ? T`
    <label class="row" style="border-top:1px solid var(--line);padding:.45rem 0;
           cursor:pointer">
      <input type="checkbox" class="cln-cat" value="${key}"
             data-size="${c.size}" style="width:auto;margin:0">
      <span style="flex:1;min-width:10rem">${esc(c.label)}
        ${c.note ? `<div class="meta" style="margin:0">${esc(c.note)}</div>` : ""}</span>
      <span class="meta" style="margin:0">${c.count.toLocaleString()} 個檔案</span>
      <b style="min-width:5.5rem;text-align:right">${fmtBytes(c.size)}</b>
    </label>` : "";
  const vidRow = (v) => T`
    <label class="row" style="border-top:1px solid var(--line);padding:.45rem 0;
           cursor:${v.deletable ? "pointer" : "default"}">
      <input type="checkbox" class="cln-vid" value="${v.id}"
             data-size="${v.size}" style="width:auto;margin:0"
             ${v.deletable ? "" : "disabled"}>
      <span style="flex:1;min-width:10rem">來源影片 <b>${v.id}</b>
        <div class="meta" style="margin:0">${
          v.deleted ? t("來源已刪除 — 擷取的頁面仍保留")
          : v.deletable ? T`已處理（擷取了 ${v.frames ?? "?"} 個影格）— 由其建立的頁面在刪除後仍會保留；刪除後將無法重新擷取`
          : t("尚未完全處理 — 請保留")}</div></span>
      <b style="min-width:5.5rem;text-align:right">${v.exists ? fmtBytes(v.size) : "—"}</b>
    </label>`;
  card.innerHTML = T`<h2>儲存空間與清理</h2>
    ${s.videos.map(vidRow).join("")}
    ${Object.entries(s.categories).map(([k, c]) => catRow(k, c)).join("")}
    <div class="row" style="margin-top:.7rem">
      <button class="danger" onclick="runCleanup()">刪除選取項目</button>
      <span class="meta" id="cln-total" style="margin:0"></span>
    </div>`;
  const update = () => {
    const tot = [...card.querySelectorAll("input:checked")]
      .reduce((a, el) => a + (+el.dataset.size || 0), 0);
    $("cln-total").textContent = tot ? T`將釋放 ${fmtBytes(tot)}` : "";
  };
  card.querySelectorAll("input").forEach(el => el.onchange = update);
}

async function runCleanup() {
  const cats = [...document.querySelectorAll(".cln-cat:checked")].map(e => e.value);
  const vids = [...document.querySelectorAll(".cln-vid:checked")].map(e => e.value);
  if (!cats.length && !vids.length) { alert(t("未選取任何項目。")); return; }
  const warn = [];
  if (cats.includes("hidden_pages")) warn.push(t("已隱藏頁面將無法再取消隱藏"));
  if (cats.includes("duplicate_pages")) warn.push(t("重複頁面將無法再透過「非重複項目」復原"));
  if (vids.length) warn.push(T`來源影片 ${vids.join(", ")} 刪除後將無法重新擷取`);
  if (!confirm(T`確定要刪除選取的檔案？${warn.length ? t("\n\n注意：") + warn.join(t("；")) + t("。") : ""}`))
    return;
  try {
    const r = await api(`/projects/${current}/cleanup`, {method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({categories: cats, videos: vids})});
    alert(T`已釋放 ${fmtBytes(r.freed)}。`);
  } catch (e) { alert(t("清理失敗：") + e.message); }
  renderStorage(current);
}

// ---- reshoot review: triage the flagged pages one by one before capturing
let review = null;

async function startReshootReview() {
  const r = await api(`/projects/${current}/reshoot`);

function renderReview() {
  const body = $("tabbody"), rv = review;

  if (rv.i >= rv.items.length) {
    body.innerHTML = T`<div class="card" style="text-align:center">

      <p>確認重拍 ${rv.kept} 頁 · 略過 ${rv.dismissed} 頁${

      <div class="row" style="justify-content:center">
        <button style="font-size:1.05rem;padding:.7rem 1.4rem"

      </div></div>`;

  }

  body.innerHTML = T`<div class="card">
    <div class="row">
      <b>${rv.i + 1} / ${rv.items.length}</b>
      <b>${it.printed_number != null ? t("第 ") + it.printed_number + t(" 頁") : t("無頁碼")}</b>
      <span class="meta" style="margin:0">· ${it.id}</span>
      <a href="javascript:void(0)" onclick="gotoPage('${it.id}')"
         style="margin-left:.6rem">在頁面分頁中開啟</a>
      <button class="secondary" style="margin-left:auto"

    </div>
    <div style="color:#b45309;margin:.4rem 0">⚠ ${esc(it.reasons.join("; "))}</div>
    <div style="display:flex;gap:1rem;flex-wrap:wrap;align-items:flex-start">
      <div style="flex:1 1 340px;min-width:280px">
        ${pg.color ? `<img decoding="async"
           src="/api/projects/${current}/thumb/${pg.color}?w=900${fv(pg.color)}"
           style="max-height:70vh;max-width:100%;border:1px solid var(--line);
                  border-radius:6px;display:block;margin:0 auto">`
          : t("<div class='meta'>此頁面尚無已處理的影像</div>")}
      </div>
      <div style="flex:1 1 340px;min-width:280px">
        <div class="meta" style="margin:0 0 .3rem">擷取的 Markdown — 在此編輯並儲存，或與頁面對照以決定是否重拍／重新辨識：</div>
        <textarea id="md-${it.id}" data-page="${it.id}"
          placeholder="${pg.md ? t("載入中…") : t("此頁面無辨識結果")}"
          style="height:66vh;font-size:.82rem;line-height:1.4"
          oninput="this.dataset.dirty=1;const b=$('mdsave-${it.id}');
                   b.textContent='儲存 Markdown *';b.disabled=false"></textarea>
        <div class="row" style="margin-top:.4rem">
          <button id="mdsave-${it.id}" onclick="saveMd('${it.id}')">儲存 Markdown</button>
          <button class="secondary" title="將強制換行的文字接續為流暢的
段落 — 修復逐行辨識的欄位（審閱後儲存）"
            onclick="reflowMd('${it.id}')">⤸ 重新重排</button>
        </div>
      </div>
    </div>
    <div class="row" style="margin-top:.8rem">
      <button style="font-size:1rem;padding:.65rem 1.3rem"
        onclick="reviewKeep()">✔ 確認 — 進行重拍</button>
      <button class="secondary" style="font-size:1rem;padding:.65rem 1.3rem"
        onclick="reviewDismiss('${it.id}')">看起來沒問題 — 略過</button>
      <button class="secondary" style="font-size:1rem;padding:.65rem 1.3rem"
        title="稍後決定 — 保留標記並繼續"
        onclick="reviewSkip()">⏭ 暫時跳過</button>
      <button class="danger" style="margin-left:auto"

        onclick="reviewHide('${it.id}')">隱藏頁面</button>
    </div></div>`;
  // fill the editable markdown (async — the manifest only has its path)
  if (pg.md) {
    fetch(`/api/projects/${current}/file/${pg.md}`)
      .then(r => r.ok ? r.text() : Promise.reject())
      .then(md => {
        const el = $("md-" + it.id);
        // don't clobber the editor if we've moved on, or the user is editing it
        if (el && review.items[review.i]?.id === it.id
            && !el.dataset.dirty && document.activeElement !== el)
          el.value = md;
      })
      .catch(() => {});

// guard against navigating away from unsaved markdown edits in the review pane
function reviewDirtyOK() {
  const it = review?.items?.[review.i];
  const el = it && $("md-" + it.id);
  if (el && el.dataset.dirty)
    return confirm(t("此頁面有未儲存的 Markdown 編輯內容。確定不儲存直接離開？\n\n（請先點擊「儲存 Markdown」以保留變更。）"));
  return true;
}

function reviewKeep() { if (!reviewDirtyOK()) return; review.kept++; review.i++; renderReview(); }

// leave the item exactly as it is (still flagged) and move on
function reviewSkip() { if (!reviewDirtyOK()) return; review.skipped++; review.i++; renderReview(); }

async function reviewDismiss(pageId) {
  if (!reviewDirtyOK()) return;
  const pg = (window._proj?.pages || []).find(x => x.id === pageId) || {};
  const body = {ignore_suspect: true};
  if (pg.needs_reshoot) body.needs_reshoot = false;
  try {
    await api(`/projects/${current}/pages/${pageId}`, {method: "PATCH",
      headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  } catch (e) { alert(t("失敗：") + e.message); return; }
  // figure close-up marks are separate flags — clear them too, best effort
  for (let ri = 0; ri < (pg.regions || []).length; ri++)
    if (pg.regions[ri].needs_reshoot)
      await api(`/projects/${current}/pages/${pageId}/figures/${ri}/reshoot?flag=false`,
                {method: "POST"}).catch(() => {});
  pg.suspect_ignored = true;
  pg.needs_reshoot = false;
  (pg.regions || []).forEach(r => r.needs_reshoot = false);
  review.dismissed++; review.i++; renderReview();
}

async function reviewHide(pageId) {
  try { await api(`/projects/${current}/pages/${pageId}`, {method: "DELETE"}); }
  catch (e) { alert(t("失敗：") + e.message); return; }
  review.dismissed++; review.i++; renderReview();
}

// ---- crop wizard: step through every region that needs a crop, opening the
// crop tool inline on each one so the user just draws → Save & next → draw…
let cropReview = null;
async function startCropReview() {
  const r = await api(`/projects/${current}/crop-list`);
  if (!r.items?.length) { alert(t("裁切清單為空 — 每個區塊皆已裁切。")); return; }
  // flatten pages → one wizard step per uncropped region
  const steps = [], totals = {};
  for (const it of r.items) {
    totals[it.id] = it.regions.length;
    it.regions.forEach((rg, k) => steps.push({
      pageId: it.id, printed_number: it.printed_number, ridx: rg.idx,
      caption: rg.caption || "", suspect: !!it.suspect,
      lastOfPage: k === it.regions.length - 1,
    }));
  }
  cropReview = {steps, totals, cropped: {}, i: 0, done: 0, skipped: 0};
  // render the host body ONCE, with the crop modal in the DOM, then drive it
  $("main").scrollTop = 0;
  $("tabbody").innerHTML = T`<div class="card">
    <div class="row">
      <b>✂ 裁切精靈</b>
      <span class="meta" style="margin:0">為模型找到的每個圖表繪製方框（拖曳角落可微調，或點擊 ✨ 智慧裁切），接著點擊儲存並前往下一筆</span>
      <button class="secondary" style="margin-left:auto"
        onclick="cropWizExit()">✕ 結束</button>
    </div>
    <div class="meta" id="crop-wiz-status" style="margin-top:.4rem"></div>
  </div>` + cropModalHtml();
  cropWizStep();
}
function cropWizStep() {
  const cr = cropReview;
  if (!cr) return;
  if (cr.i >= cr.steps.length) return cropWizDone();
  const s = cr.steps[cr.i];
  openCrop(s.pageId, s.ridx, "cropreview", true);   // shows modal + wizard UI
  const info = $("crop-wiz-info");
  if (info) info.innerHTML = `<b>${cr.i + 1} / ${cr.steps.length}</b> · ` +
    `${s.printed_number != null ? t("頁面 ") + s.printed_number : s.pageId} · ` +
    T`區塊 ${s.ridx}`;
  // full caption gets its own multi-line banner above the image (never truncated)
  const cap = $("crop-wiz-caption");
  if (cap) {
    if (s.caption) {
      cap.innerHTML = T`<b>裁切此處：</b> ${esc(s.caption)}`;
      cap.style.display = "";
    } else {
      cap.style.display = "none";
    }
  }
}
// called by saveCrop() after a crop is stored (Save & next)
async function cropWizAdvance(cropped) {
  const cr = cropReview;
  if (!cr) return;
  const s = cr.steps[cr.i];
  if (cropped) { cr.done++; cr.cropped[s.pageId] = (cr.cropped[s.pageId] || 0) + 1; }
  else cr.skipped++;
  // once every region on a suspect page is cropped, vouch for the page so it
  // leaves the lists (clears the dismissible quality note)
  if (s.lastOfPage && s.suspect && (cr.cropped[s.pageId] || 0) === cr.totals[s.pageId])
    try { await api(`/projects/${current}/pages/${s.pageId}/accept-crops`, {method: "POST"}); }
    catch {}
  cr.i++;
  cropWizStep();
}
function cropWizSkip() { cropWizAdvance(false); }
function cropWizExit() {
  cropReview = null;
  $("crop-modal") && ($("crop-modal").style.display = "none");
  openProject(current, "pipeline");
}
function cropWizDone() {
  const cr = cropReview;
  cropReview = null;
  $("crop-modal") && ($("crop-modal").style.display = "none");
  $("tabbody").innerHTML = T`<div class="card" style="text-align:center">
    <h2>裁切精靈完成</h2>
    <p>已裁切 ${cr.done} 個區塊 · 已略過 ${cr.skipped} 個</p>
    <button class="secondary" onclick="openProject(current,'pipeline')">返回處理流程</button>
  </div>`;
}

let cropCtx = null;
function openCrop(pageId, figIdx, origin = "figures", isRegion = false) {
  const pg = window._proj.pages.find(p => p.id === pageId);
  const reg = pg.regions?.[figIdx];
  // a re-acquired close-up is its OWN image — trim IT, not the full page,
  // so re-cropping can never destroy the close-up you took
  const own = !!(reg && reg.own_image);
  const figRel = (pg.figures || [])[figIdx];
  const bb = own ? null : reg?.bbox_norm;
  cropCtx = {pageId, figIdx, origin, isRegion, own, mode: null, corner: -1,
             quad: (!own && reg?.quad_norm && reg.quad_norm.length === 4)
               ? reg.quad_norm.map(p => [...p])
               : bb ? [[bb[0],bb[1]],[bb[2],bb[1]],[bb[2],bb[3]],[bb[0],bb[3]]]
               : own ? [[0.02,0.02],[0.98,0.02],[0.98,0.98],[0.02,0.98]] : null};
  const img = $("crop-img");
  const src = (own && figRel) ? figRel : pg.color;
  img.src = `/api/projects/${current}/file/${src}?t=${Date.now()}`;
  $("crop-modal").style.display = "flex";
  // wizard vs one-off UI
  const wiz = origin === "cropreview";
  if ($("crop-wiz-btns")) {
    $("crop-wiz-btns").style.display = wiz ? "" : "none";
    $("crop-normal-btns").style.display = wiz ? "none" : "";
    $("crop-wiz-info").style.display = wiz ? "" : "none";
    $("crop-wiz-caption").style.display = "none";  // set by cropWizStep when there's a caption
    $("crop-hint").style.display = wiz ? "none" : "";
    $("crop-title").textContent = wiz ? t("✂ 裁切精靈") : t("重新裁切圖表");
  }
  img.onload = () => drawCropQuad();
  attachCropHandlers();
}

function attachCropHandlers() {
  const img = $("crop-img");
  const stage = $("crop-stage");
  const norm = (e) => {
    const r = img.getBoundingClientRect();
    return [Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)),
            Math.max(0, Math.min(1, (e.clientY - r.top) / r.height))];
  };
  // each edge connects two corners: top 0-1, right 1-2, bottom 2-3, left 3-0
  const EDGES = [[0,1],[1,2],[2,3],[3,0]];
  stage.onpointerdown = (e) => {
    const [x, y] = norm(e);
    stage.setPointerCapture(e.pointerId);
    if (cropCtx.quad) {
      const r = img.getBoundingClientRect();
      const px = (c) => [(c[0]-x) * r.width, (c[1]-y) * r.height];
      // grab a corner first (finger-sized threshold)
      const near = cropCtx.quad.findIndex(c => Math.hypot(...px(c)) < 22);
      if (near >= 0) {
        cropCtx.mode = "corner"; cropCtx.corner = near;
        cropCtx.anchor = [...cropCtx.quad[(near + 2) % 4]];  // opposite corner (Shift pivot)
        return;
      }
      // else grab an edge midpoint → translate the whole edge as a unit
      const ei = EDGES.findIndex(([a,b]) => {
        const m = [(cropCtx.quad[a][0]+cropCtx.quad[b][0])/2,
                   (cropCtx.quad[a][1]+cropCtx.quad[b][1])/2];
        return Math.hypot(...px(m)) < 22;
      });
      if (ei >= 0) {
        cropCtx.mode = "edge"; cropCtx.edge = ei;
        cropCtx.dragStart = [x, y];
        cropCtx.startQuad = cropCtx.quad.map(c => [...c]);
        return;
      }
    }
    cropCtx.mode = "draw";
    cropCtx.start = [x, y];
    cropCtx.quad = [[x,y],[x,y],[x,y],[x,y]];
    drawCropQuad();
  };
  stage.onpointermove = (e) => {
    if (!cropCtx.mode) return;
    const [x, y] = norm(e);
    if (cropCtx.mode === "draw") {
      const [sx, sy] = cropCtx.start;
      const x0 = Math.min(sx,x), y0 = Math.min(sy,y),
            x1 = Math.max(sx,x), y1 = Math.max(sy,y);
      cropCtx.quad = [[x0,y0],[x1,y0],[x1,y1],[x0,y1]];
    } else if (cropCtx.mode === "edge") {
      // move both endpoints of the edge by the same delta (translate the line).
      // Shift keeps the rectangle square: a horizontal edge moves only up/down,
      // a vertical edge only left/right, so the corners stay at 90°.
      let dx = x - cropCtx.dragStart[0], dy = y - cropCtx.dragStart[1];
      if (e.shiftKey) {
        if (cropCtx.edge === 0 || cropCtx.edge === 2) dx = 0;   // top/bottom
        else dy = 0;                                            // left/right
      }
      const [a, b] = EDGES[cropCtx.edge];
      const clamp = (v) => Math.max(0, Math.min(1, v));
      for (const c of [a, b]) {
        cropCtx.quad[c][0] = clamp(cropCtx.startQuad[c][0] + dx);
        cropCtx.quad[c][1] = clamp(cropCtx.startQuad[c][1] + dy);
      }
    } else if (e.shiftKey && cropCtx.anchor) {
      // Shift + corner: keep it an axis-aligned rectangle, pivoting on the
      // opposite corner (like drawing a fresh box from that corner)
      const [ox, oy] = cropCtx.anchor;
      const x0 = Math.min(x, ox), y0 = Math.min(y, oy),
            x1 = Math.max(x, ox), y1 = Math.max(y, oy);
      cropCtx.quad = [[x0,y0],[x1,y0],[x1,y1],[x0,y1]];
      cropCtx.corner = (x <= ox ? (y <= oy ? 0 : 3) : (y <= oy ? 1 : 2));
    } else {
      cropCtx.quad[cropCtx.corner] = [x, y];
    }
    drawCropQuad();
    showLoupe(x, y);
  };
  stage.onpointerup = () => {
    cropCtx.mode = null; cropCtx.corner = -1; cropCtx.edge = -1;
    cropCtx.anchor = null;
    $("crop-loupe").style.display = "none";
  };
}
function showLoupe(nx, ny) {
  // 3x magnifier centered on the drag point, offset so the finger doesn't hide it
  const img = $("crop-img"), loupe = $("crop-loupe");
  const Z = 3, L = 140;
  const w = img.clientWidth, h = img.clientHeight;
  loupe.style.display = "block";
  loupe.style.backgroundImage = `url("${img.src}")`;
  loupe.style.backgroundSize = `${w * Z}px ${h * Z}px`;
  loupe.style.backgroundPosition =
    `${-(nx * w * Z - L / 2)}px ${-(ny * h * Z - L / 2)}px`;
  const lx = Math.max(0, Math.min(w - L, nx * w - L / 2));
  const above = ny * h - L - 24;
  loupe.style.left = lx + "px";
  loupe.style.top = (above > 0 ? above : ny * h + 24) + "px";
}

function drawCropQuad() {
  const img = $("crop-img"), poly = $("crop-poly");
  const w = img.clientWidth, h = img.clientHeight;
  if (!cropCtx?.quad) {
    poly.setAttribute("points", "");
    [0,1,2,3].forEach(i => {
      $("crop-h"+i).style.display = "none";
      $("crop-e"+i).style.display = "none";
    });
    return;
  }
  const q = cropCtx.quad;
  poly.setAttribute("points", q.map(c => `${c[0]*w},${c[1]*h}`).join(" "));
  q.forEach((c, i) => {
    const hd = $("crop-h"+i);
    hd.style.display = "block";
    hd.setAttribute("cx", c[0]*w);
    hd.setAttribute("cy", c[1]*h);
  });
  // edge-midpoint handles (square) — drag to move the whole edge
  [[0,1],[1,2],[2,3],[3,0]].forEach(([a,b], i) => {
    const mx = (q[a][0]+q[b][0])/2 * w, my = (q[a][1]+q[b][1])/2 * h;
    const e = $("crop-e"+i);
    e.style.display = "block";
    e.setAttribute("x", mx - 10);
    e.setAttribute("y", my - 10);
  });
}

async function magicCrop() {
  try {
    // first click fetches candidates; further clicks cycle through them
    if (!cropCtx.magic || !cropCtx.magic.length) {
      const r = await api(`/projects/${current}/pages/${cropCtx.pageId}/magic-crop`, {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify(cropCtx.quad ? {quad_norm: cropCtx.quad} : {})});
      if (!r.ok) { alert(r.detail || t("偵測信心度不足")); return; }
      cropCtx.magic = r.candidates || [r.bbox_norm];
      cropCtx.magicI = 0;
    } else {
      cropCtx.magicI = (cropCtx.magicI + 1) % cropCtx.magic.length;
    }
    const [x0, y0, x1, y1] = cropCtx.magic[cropCtx.magicI];
    cropCtx.quad = [[x0,y0],[x1,y0],[x1,y1],[x0,y1]];
    drawCropQuad();
  } catch (e) { alert(t("智慧裁切失敗：") + e.message); }
}

async function saveCrop() {
  if (!cropCtx?.quad) { alert(t("請先框選範圍")); return; }
  try {
    await api(`/projects/${current}/pages/${cropCtx.pageId}/`
      + (cropCtx.isPage ? "crop-page"
         : cropCtx.isRegion ? `regions/${cropCtx.figIdx}/crop`
         : `figures/${cropCtx.figIdx}/crop`), {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({quad_norm: cropCtx.quad})});
  } catch (e) { alert(t("裁切失敗：") + e.message); return; }
  if (!cropCtx.isPage)
    bumpFig(`figures/${cropCtx.pageId}_${String.fromCharCode(97 + cropCtx.figIdx % 26)}.png`);
  $("crop-modal").style.display = "none";
  if (cropCtx.origin === "cropreview" && cropReview) {
    cropWizAdvance(true);   // records the crop, opens the next region's crop tool
    return;
  }
  if (cropCtx.origin === "pages") gotoPage(cropCtx.pageId);
  else if (cropCtx.origin === "figures" && !cropCtx.isRegion)
    // re-crop from the figures tab: swap just this thumbnail so the user keeps
    // their scroll position instead of being bounced to the top
    refreshFigThumb(`figures/${cropCtx.pageId}_${String.fromCharCode(97 + cropCtx.figIdx % 26)}.png`);
  else openProject(current, "figures");
}

async function autoRefine() {
  const btn = event.target;
  btn.disabled = true; btn.textContent = t("微調中…");
  try {
    const r = await api(`/projects/${current}/figures/auto-refine`, {method:"POST"});
    alert(T`已透過邊緣偵測微調 ${r.refined} 個圖表裁切。`);
  } catch (e) { alert(t("自動微調失敗：") + e.message); }
  openProject(current, "figures");
}

async function figReacq(pageId, figIdx, flag = true, origin) {
  try { await api(`/projects/${current}/pages/${pageId}/figures/${figIdx}` +
                  `/reshoot?flag=${flag}`, {method:"POST"});
  } catch (e) { alert(t("失敗：") + e.message); return; }
  if (origin === "pages") gotoPage(pageId);
  else openProject(current, "figures");
}

async function delFigure(pageId, figIdx) {
  if (!confirm(t("要從書中刪除此圖表嗎？"))) return;
  await api(`/projects/${current}/pages/${pageId}/figures/${figIdx}`, {method:"DELETE"});
  openProject(current, "figures");
}

async function rotateFigure(pageId, figIdx, dir) {
  await api(`/projects/${current}/pages/${pageId}/figures/${figIdx}/rotate?dir=${dir}`,
            {method:"POST"});
  openProject(current, "figures");
}

async function setCaption(pageId, figIdx, caption) {
  try { await api(`/projects/${current}/pages/${pageId}/figures/${figIdx}/caption`,
    {method:"POST", headers:{"Content-Type":"application/json"},
     body: JSON.stringify({caption})}); }
  catch (e) { alert(t("圖說儲存失敗：") + e.message); }
}

async function swapCaptions(pageId, a, b) {
  try { await api(`/projects/${current}/pages/${pageId}/figures/swap-captions`,
    {method:"POST", headers:{"Content-Type":"application/json"},
     body: JSON.stringify({a, b})}); }
  catch (e) { alert(t("對調失敗：") + e.message); return; }
  renderTab("figures", window._proj);
}

function renderFiguresTab(p, clusters) {
  const name = p.name, body = $("tabbody");
  const key = (pid, fi) => pid + "#" + fi;
  const clusterOf = {};
  clusters.forEach((cl, ci) => cl.forEach(m => clusterOf[key(m.page_id, m.fig_idx)] = ci));

  const allRows = [];
  p.pages.forEach(pg => {
    if (pg.status === "duplicate" || pg.status === "deleted") return;
    (pg.figures || []).forEach((f, i) => {
      const letter = f.split("_").pop().split(".")[0];
      const ridx = letter.charCodeAt(0) - 97;
      allRows.push({pg, f, i, ch: pg.chapter || "Front matter",
                 caption: (pg.regions?.[ridx]?.caption) || "",
                 reacq: !!(pg.regions?.[ridx]?.needs_reshoot)});
    });
  });
  freshFiltersFor(name);   // fresh project -> fresh filters (shared with pages)
  const figChapters = [];
  allRows.forEach(r => { if (!figChapters.includes(r.ch)) figChapters.push(r.ch); });
  // a chapter chosen on the pages tab may have no figures — keep it in the list
  // so the shared filter stays visible/selected across the two tabs
  const figChapterOpts = chapterFilter && !figChapters.includes(chapterFilter)
    ? [...figChapters, chapterFilter] : figChapters;
  const rows = allRows.filter(r => !chapterFilter || r.ch === chapterFilter);
  const groups = [];
  rows.forEach(r => {
    const last = groups[groups.length - 1];
    const num = r.pg.printed_number;
    if (last && num != null && last.num === num) last.rows.push(r);
    else groups.push({num, rows: [r]});
  });

  const figRow = (r, g) => {
    const gi = g.rows.indexOf(r), next = g.rows[gi + 1];
    const canSwap = next && next.pg.id === r.pg.id;   // swap within one page
    return T`
      <div class="row" style="border-top:1px solid var(--line);padding:.7rem 0">
        <a href="javascript:void(0)" onclick="openCrop('${r.pg.id}', ${r.i})"
           title="點擊以重新裁切">
          <img loading="lazy" decoding="async"
               src="/api/projects/${name}/thumb/${r.f}?w=380${fv(r.f)}"
               style="height:130px;border:1px solid var(--line);border-radius:4px;
                      cursor:crosshair"></a>
        <div style="flex:1;min-width:14rem">
          <div><a href="javascript:void(0)" onclick="gotoPage('${r.pg.id}')">
            <b>${r.pg.printed_number != null ? t("頁面 ") + r.pg.printed_number
                : t("未編頁碼")}</b> <span class="meta">· ${r.pg.id}</span></a>
            ${r.reacq ? T`<span class="badge acceptable">📷 已排入重拍佇列</span>` : ""}</div>
          <div class="row" style="margin-top:.3rem;align-items:flex-start">
            <textarea rows="3" placeholder="此圖表的圖說…"
                   style="flex:1;min-width:8rem;margin:0;min-height:0;resize:vertical"
                   onchange="setCaption('${r.pg.id}', ${r.i}, this.value)">${esc(r.caption)}</textarea>
            ${canSwap ? T`<button class="secondary" title="與下方圖表的圖說對調"
                onclick="swapCaptions('${r.pg.id}', ${r.i}, ${next.i})">⇅ 對調</button>` : ""}
          </div>
        </div>
        <span class="row">
          <button class="secondary" title="逆時針旋轉 90°"
                  onclick="rotateFigure('${r.pg.id}', ${r.i}, 'ccw')">⟲</button>
          <button class="secondary" title="順時針旋轉 90°"
                  onclick="rotateFigure('${r.pg.id}', ${r.i}, 'cw')">⟳</button>
          <button class="secondary" onclick="openCrop('${r.pg.id}', ${r.i})">重新裁切</button>
          <input type="file" accept="image/*" id="figup-${r.pg.id}-${r.i}"
                 style="display:none" onchange="uploadFigure('${r.pg.id}', ${r.i})">
          <button class="secondary" onclick="$('figup-${r.pg.id}-${r.i}').click()">重新上傳</button>
          <button class="secondary" onclick="figReacq('${r.pg.id}', ${r.i}, ${!r.reacq})">
            ${r.reacq ? t("取消重拍標記") : t("重拍")}</button>
          <button class="danger" onclick="delFigure('${r.pg.id}', ${r.i})">刪除</button>
        </span>
      </div>`;
  };

  const groupHtml = (g) => {
    if (g.rows.length <= 1) return g.rows.map(r => figRow(r, g)).join("");
    const byCluster = {};
    g.rows.forEach(r => {
      const c = clusterOf[key(r.pg.id, r.i)];
      if (c != null) (byCluster[c] = byCluster[c] || []).push(r);
    });
    const dupBanners = Object.values(byCluster).filter(a => a.length > 1).map(a => T`
      <div class="row" style="background:#fffbeb;border-radius:6px;padding:.35rem .7rem;margin:.35rem 0">
        <span class="meta" style="margin:0;color:#b45309">⚠ 其中有 ${a.length} 個是重複拍攝的同一圖表</span>
        <button class="secondary" onclick='keepBest(${JSON.stringify(
          a.map(r => ({page_id: r.pg.id, fig_idx: r.i})))})'>保留最清晰者，刪除其餘</button>
      </div>`).join("");
    return T`<div style="border:1px solid var(--line);border-radius:8px;padding:.2rem .8rem;margin:.6rem 0">
      <div class="meta" style="padding:.4rem 0">${g.rows.length} 個圖表於印刷頁面 ${g.num}
        — 各自保留其圖說；若兩處圖說顛倒請使用 ⇅ 對調</div>
      ${dupBanners}
      ${g.rows.map(r => figRow(r, g)).join("")}
    </div>`;
  };

  body.innerHTML = T`<div class="card"><h2>圖表 <span class="meta">
    (依書籍順序 — 重新裁切、圖說、替換或刪除)</span></h2>
    <div class="row" style="margin-bottom:.6rem">
      <label style="margin:0">章節</label>
      <select style="width:auto;margin:0"
        onchange="chapterFilter=this.value;renderTab('figures',window._proj)">
        <option value="">全部</option>
        ${figChapterOpts.map(c => `<option ${chapterFilter === c ? "selected" : ""}
           value="${esc(c)}">${esc(c)}</option>`).join("")}
      </select>
      ${chapterFilter ? T`<span class="meta" style="margin:0">${rows.length} 個，共
        ${allRows.length} 個圖表</span>` : ""}
      <button class="secondary" style="margin-left:auto" onclick="autoRefine()">✨ 自動微調裁切（邊緣偵測）</button>
      <button onclick="aiRefine(this)" title="由 Claude 根據頁面照片推算各圖表邊角；
絕不更動目前的手動裁切">🤖 AI 微調裁切 (Claude)</button>
    </div>` +
    (groups.map(groupHtml).join("")
      || (chapterFilter
          ? t("<div class='meta'>此章節尚無圖表</div>")
          : t("<div class='meta'>尚無圖表</div>")))
    + `</div>` + cropModalHtml();
}
async function uploadFigure(pageId, figIdx) {
  const input = $(`figup-${pageId}-${figIdx}`);
  if (!input.files.length) return;
  const fd = new FormData();
  fd.append("photo", input.files[0]);
  const r = await fetch(
    `/api/projects/${current}/pages/${pageId}/figures/${figIdx}/upload`,
    {method:"POST", body: fd});
  if (!r.ok) alert(t("上傳失敗"));
  bumpFig(`figures/${pageId}_${String.fromCharCode(97 + figIdx % 26)}.png`);
  openProject(current, "figures");
}

async function keepBest(items) {
  if (!confirm(T`保留 ${items.length} 個圖表中清晰度最高者並刪除其餘圖表？`)) return;
  await api(`/projects/${current}/figures/keep-best`, {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({items})});
  openProject(current, "figures");
}

async function deletePage(pageId) {
  await api(`/projects/${current}/pages/${pageId}`, {method:"DELETE"});
  openProject(current, "pages");
}

async function restorePage(pageId) {
  await api(`/projects/${current}/pages/${pageId}/restore`, {method:"POST"});
  openProject(current, "pages");
}

refreshProjects();
startJobsPolling();   // global queue chip, independent of which book is open
</script>
