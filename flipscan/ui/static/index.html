<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlipScan</title>
<script src="/static/i18n.en.js"></script>
<script src="/static/i18n.js"></script>
<style>
  :root { --bg:#f5f5f4; --panel:#fff; --line:#e7e5e4; --ink:#1c1917; --dim:#78716c;
          --accent:#0d9488; --bad:#dc2626; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--ink);
         display:grid; grid-template-columns: 260px 1fr; height:100vh; }
  aside { background:#292524; color:#fafaf9; padding:1rem; overflow-y:auto;
          display:flex; flex-direction:column; }
  /* projects fill the sidebar; the language picker sits on its own row at the bottom */
  #nav-drawer { flex:1; display:flex; flex-direction:column; }
  #lang-pick { margin-top:auto; padding-top:1rem; }
  aside h1 { font-size:1.1rem; margin:0 0 1rem; }
  .proj { padding:.5rem .7rem; border-radius:6px; cursor:pointer; margin-bottom:.25rem;
          font-size:.9rem; }
  .proj:hover, .proj.active { background:#44403c; }
  .proj .sub { font-size:.75rem; color:#a8a29e; }
  #burger { display:none; background:#44403c; flex:none; padding:.35rem .75rem; }
  #nav-current { display:none; }
  main { overflow-y:auto; padding:1.5rem 2rem; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px;
          padding:1.25rem 1.5rem; margin-bottom:1.25rem; }
  h2 { margin:.2rem 0 1rem; font-size:1.05rem; }
  button { background:var(--accent); color:#fff; border:0; border-radius:6px;
           padding:.45rem .9rem; cursor:pointer; font-size:.85rem; }
  button.secondary { background:#57534e; }
  button:disabled { opacity:.5; cursor:default; }
  .stages { display:flex; gap:.4rem; flex-wrap:wrap; margin-bottom:.8rem; }
  .stage { padding:.25rem .6rem; border-radius:999px; font-size:.75rem;
           background:#f3f4f6; color:#374151; }
  .stage.done { background:#dcfce7; color:#166534; }
  #log { background:#1c1917; color:#d6d3d1; font-family:ui-monospace,monospace;
         font-size:.75rem; padding: .8rem 1rem; border-radius:6px; max-height:220px;
         overflow-y:auto; white-space:pre-wrap; display:none; }
  #progress { display:none; margin:.8rem 0 .2rem; }
  .ptrack { background:#e7e5e4; border-radius:999px; height:14px; overflow:hidden; }
  .pfill { background:var(--accent); height:100%; width:0; border-radius:999px;
           transition: width .6s ease; }
  .plabel { display:flex; justify-content:space-between; font-size:.8rem;
            color:var(--dim); margin-top:.35rem; }
  .stage.active { background:#ccfbf1; color:#0f766e; outline:2px solid var(--accent); }
  .tabs { display:flex; gap:.25rem; margin-bottom:1rem; }
  .tab { padding:.4rem .9rem; border-radius:6px 6px 0 0; cursor:pointer; font-size:.85rem;
         background:#e7e5e4; }
  .tab.active { background:var(--panel); border:1px solid var(--line); border-bottom:0; }
  .pagerow { display:grid; grid-template-columns: 300px 1fr; gap:1rem; padding:1rem 0;
             border-top:1px solid var(--line); }
  .pagerow img { width:100%; border:1px solid var(--line); border-radius:4px; }
  .pagerow.suspect { background:#fef2f2; }
  .pagegrid { display:grid; grid-template-columns: minmax(240px, 340px) 1fr;
              gap:1rem; margin-top:.6rem; }
  .pagegrid > div:last-child { display:flex; flex-direction:column; }
  .pagegrid textarea { flex:1 1 auto; min-height:200px; }  /* fill the cell */
  .card.suspect { border-left:4px solid var(--bad); }
  /* page cells: don't render (or hold decoded images for) offscreen cells —
     hundreds of cells otherwise exhaust phone memory while scrolling */
  [id^="cell-"] { content-visibility: auto; contain-intrinsic-size: auto 520px; }
  .card.duplicate { opacity:.75; }
  .card.deleted { opacity:.55; }
  .meta { font-size:.75rem; color:var(--dim); margin-bottom:.4rem; }
  textarea { width:100%; min-height:200px; font-family:ui-monospace,monospace;
             font-size:.8rem; border:1px solid var(--line); border-radius:6px; padding:.6rem; }
  input, select { border:1px solid var(--line); border-radius:6px; padding:.4rem .6rem;
                  font-size:.85rem; width:100%; margin-bottom:.5rem; }
  label { font-size:.75rem; color:var(--dim); }
  .row { display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; }
  .grid3 { display:grid; grid-template-columns:2fr 1fr 1fr; gap:.5rem; }

  img, input, select, textarea { max-width:100%; }
  .page > div, .pagerow > div { min-width:0; }

  html, body { max-width:100%; overflow-x:hidden; }

  /* long unbreakable tokens (timestamped m4b filenames, voice slugs) must
     wrap instead of forcing the page wider than the viewport */
  .card { overflow-wrap: anywhere; min-width: 0; }
  .card ul { padding-left: 1.2rem; }

  /* ---- phones & small tablets ---- */
  @media (max-width: 820px) {
    main { overflow-x:hidden; }
    #tabbody, .card, details { max-width: 100%; }
    .row > * { min-width:0; }        /* let selects/labels shrink & wrap */
    .row input[type="file"] { width:100%; }
    .row select { max-width:100%; }
    body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    aside { display:flex; flex-direction:row; align-items:center; gap:.6rem; padding:.55rem .8rem;
            white-space:nowrap; overflow:visible; position:relative; }
    aside h1 { margin:0; font-size:1rem; flex:none; }
    #burger { display:inline-block; }
    #nav-current { display:inline; flex:1; min-width:0; overflow:hidden;
                   text-overflow:ellipsis; text-align:right; font-size:.85rem;
                   color:#d6d3d1; }
    #global-status { margin:0 !important; flex:none; max-width:40vw; }
    /* project list becomes a drop-down drawer under the navbar */
    #nav-drawer { display:none; }
    #nav-drawer.open { display:block; position:absolute; top:100%; left:0; right:0;
                       z-index:60; background:#292524; padding:.8rem;
                       max-height:70vh; overflow-y:auto; white-space:normal;
                       box-shadow:0 10px 24px rgba(0,0,0,.45);
                       border-bottom:1px solid #44403c; }
    #nav-drawer.open .proj { padding:.6rem .8rem; }
    #nav-drawer.open .proj .sub { display:block; }
    main { padding:.8rem; }
    .card { padding:1rem; margin-bottom:.8rem; border-radius:10px; }
    .page, .pagerow, .pagegrid { grid-template-columns:1fr; gap:.8rem; }
    .tabs { overflow-x:auto; }
    .tab { flex:none; padding:.55rem 1rem; }
    button { padding:.6rem 1.1rem; font-size:.9rem; }   /* finger-sized */
    input, select { padding:.55rem .7rem; font-size:16px; } /* stops iOS zoom-on-focus */
    textarea { min-height:150px; font-size:16px; }
    #log { max-height:150px; }
    .thumbs img { height:110px; }
  }
  .badge { font-size:.7rem; padding:.1rem .45rem; border-radius:999px; }
  .badge.suspect { background:#fee2e2; color:var(--bad); }
  .badge.ok { background:#dcfce7; color:#166534; }
  .badge.acceptable { background:#ffedd5; color:#c2410c; }
  .card.accepted { border-left:4px solid #fb923c; }
  .badge.patched { background:#dbeafe; color:#1d4ed8; }
  .badge.duplicate { background:#fef9c3; color:#854d0e; }
  .pagerow.duplicate { opacity:.55; }
  .badge.deleted { background:#f3f4f6; color:#6b7280; text-decoration:line-through; }
  .pagerow.deleted { opacity:.35; }
  button.danger { background:#dc2626; }
  .thumbs { display:flex; flex-wrap:wrap; gap:.6rem; }
  .thumbs img { height:160px; border:1px solid var(--line); border-radius:4px; }
  a { color:var(--accent); }
  #page-peek { position:fixed; z-index:200; width:min(48vw,540px);
               background:var(--panel); border:1px solid var(--line);
               border-radius:8px; box-shadow:0 10px 34px rgba(0,0,0,.4);
               display:none; }
  #peek-head { display:flex; align-items:center; gap:.5rem; padding:.35rem .6rem;
               background:#292524; color:#fafaf9; border-radius:8px 8px 0 0;
               cursor:move; user-select:none; font-size:.85rem;
               touch-action:none; }
  #peek-head button { background:#44403c; color:#fafaf9; border:0;
                      border-radius:5px; padding:.15rem .5rem; cursor:pointer;
                      font-size:.8rem; }
  #peek-body { max-height:74vh; overflow:auto; background:#0c0a09; }
  #peek-body img { display:block; }
  @keyframes fs-spin { to { transform: rotate(360deg); } }
  .spin { display:inline-block; animation: fs-spin 1.8s linear infinite; }
</style>
</head>
<body>
<aside>
  <button id="burger" onclick="toggleNav()" title="專案">☰</button>
  <h1>FlipScan</h1>
  <span id="nav-current"></span>
  <div id="global-status" style="display:none;background:#0d9488;color:#fff;
       border-radius:999px;padding:.3rem .8rem;font-size:.75rem;margin-bottom:.8rem;
       white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div>
  <div id="jobs-chip" onclick="openJobsModal()" title="顯示工作佇列"
       style="display:none;cursor:pointer;background:#1c1917;color:#fafaf9;
       border-radius:999px;padding:.3rem .8rem;font-size:.75rem;margin-bottom:.8rem;
       white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div>
  <div id="nav-drawer">
    <div id="projects"></div>
    <div style="margin-top:1rem; display:flex; gap:.4rem">
      <button class="secondary" style="flex:1" onclick="showNew()">+ 新增專案</button>
      <button class="secondary" onclick="showSettings()" title="設定">⚙</button>
    </div>
    <div id="lang-pick"></div>
  </div>
</aside>
<main id="main"><div class="card">選取或建立專案。</div></main>

<div id="jobs-modal" style="display:none;position:fixed;inset:0;z-index:60;
     background:rgba(0,0,0,.6);align-items:flex-start;justify-content:center;
     padding:4vh 2vw" onclick="if(event.target===this)closeJobsModal()">
  <div style="background:#fff;border-radius:10px;padding:1rem;max-width:640px;
       width:100%;max-height:90vh;overflow:auto">
    <div class="row" style="margin-bottom:.6rem">
      <h2 style="margin:0">工作佇列</h2>
      <span class="meta" style="margin:0">背景工作 — 處理流程、校對與重新辨識均在此執行，並在重啟後繼續保留</span>
      <button class="secondary" style="margin-left:auto"
              onclick="closeJobsModal()">關閉</button>
    </div>
    <div id="jobs-body"><div class="meta">載入中…</div></div>
  </div>
</div>
<script>
let current = null;
const $ = (id) => document.getElementById(id);
I18N.translateStatic();
I18N.reportToServer();
$("lang-pick").innerHTML = I18N.picker();

// display names for keys the server sends as-is (stage / page / job status);
// the keys themselves stay English — code compares against them
const LABELS = {
  extract: t("抽取影格"), score: t("評分"), cluster: t("分頁分群"), select: t("挑選最佳影格"),
  preprocess: t("影像前處理"), transcribe: t("文字辨識"), figures: t("擷取圖表"), assemble: t("組裝成書"),
  ok: t("正常"), suspect: t("可疑"), duplicate: t("重複"), deleted: t("已隱藏"), patched: t("已補拍"),
  high: t("高"), medium: t("中"), low: t("低"),
  cover: t("封面"), queued: t("排隊中"), running: t("執行中"), done: t("完成"), error: t("錯誤"),
  canceled: t("已取消"), pending: t("未執行"),
  "pages transcribed": t("頁已辨識"), "pages corrected": t("頁已校正"), videos: t("部影片"),
};
const STAGE_HELP = {
  extract: t("把影片的每一格存成圖片"),
  score: t("替每一格打分數：清晰度、平整度、手指遮擋、晃動"),
  cluster: t("依翻頁動作把連續影格分成一頁一頁"),
  select: t("每一頁挑出最清楚的一格（開啟跨頁切分時在這裡切成左右兩頁）"),
  preprocess: t("裁出書頁、透視校正，產生給模型看的圖"),
  transcribe: t("用視覺模型把頁面辨識成文字"),
  figures: t("把頁面上的圖表裁切出來並提升畫質"),
  assemble: t("把所有頁面的文字與圖表組成整本書"),
};
const lbl = (k) => LABELS[k] || k;
const TAB_LABELS = {
  pipeline: t("處理流程"), media: t("媒體"), frames: t("影格"), contents: t("目錄"), pages: t("頁面"),
  figures: t("圖表"), proof: t("校對"), output: t("輸出"),
};

// ---- self-updating app shell: when the server serves newer code, reload —
// but never while the user has unsaved work or a flow open
let appV = null;
async function checkAppVersion() {
  let v;
  try { v = (await (await fetch("/api/version")).json()).v; } catch { return; }
  if (appV === null) { appV = v; return; }
  if (v === appV) return;
  const busy = document.querySelector('textarea[data-dirty]')
    || ($("crop-modal") && $("crop-modal").style.display === "flex")
    || (typeof wiz !== "undefined" && wiz)
    || (typeof review !== "undefined" && review);
  if (busy) return;      // try again next tick
  location.reload();
}
setInterval(checkAppVersion, 5000);
checkAppVersion();
const api = async (path, opts) => {
  const r = await fetch("/api" + path, opts);
  if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
  return r.json();
};
const esc = (s) => (s || "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let archivedOpen = false;
function toggleArchived() {
  archivedOpen = !archivedOpen;
  const l = $("arch-list"), c = $("arch-caret");
  if (l) l.style.display = archivedOpen ? "block" : "none";
  if (c) c.textContent = archivedOpen ? "▾" : "▸";
}
async function refreshProjects() {
  const list = await api("/projects");
  const active = list.filter(p => !p.archived), archived = list.filter(p => p.archived);
  const row = (p) => T`
    <div class="proj ${p.name === current ? "active" : ""}" onclick="openProject('${p.name}')">
      <div>${esc(p.title || p.name)} ${p.running ? "⏳" : ""}</div>
      <div class="sub">${p.pages} 頁 · ${p.suspects} 頁可疑</div>
    </div>`;
  let html = active.map(row).join("")
    || t('<div class="sub" style="color:#a8a29e">沒有進行中的專案</div>');
  if (archived.length) {
    html += T`<div onclick="toggleArchived()" style="cursor:pointer;font-size:.72rem;
        color:#a8a29e;margin-top:.9rem;padding:.35rem 0;border-top:1px solid #44403c">
        <span id="arch-caret">${archivedOpen ? "▾" : "▸"}</span> 已封存 (${archived.length})</div>
      <div id="arch-list" style="display:${archivedOpen ? "block" : "none"};opacity:.75">
        ${archived.map(row).join("")}</div>`;
  }
  $("projects").innerHTML = html;
  if (!current && list.length) {
    const h = location.hash.slice(1).split("/").map(decodeURIComponent);  // #project/tab
    let saved = {};                       // last project survives new visits
    try { saved = JSON.parse(localStorage.getItem("flipscan-last") || "{}"); } catch {}
    // prefer an explicit hash/saved project (even if archived), else the first
    // ACTIVE project so a finalized book never steals focus on load
    const name = list.some(p => p.name === h[0]) ? h[0]
               : list.some(p => p.name === saved.name) ? saved.name
               : (active[0] || list[0]).name;
    const tab = (h[0] === name && h[1]) || (saved.name === name && saved.tab) || undefined;
    openProject(name, tab || undefined);
  }
}

let npMeta = {};   // isbn/publisher/year captured from a lookup pick
function showNew() {
  current = null;
  closeNav();
  npMeta = {};
  $("main").innerHTML = T`
  <div class="card">
    <h2>新增專案</h2>
    <label>尋找書籍 <span class="meta">— ISBN、書名或作者（自動填入其餘欄位）</span></label>
    <div class="row" style="flex-wrap:nowrap">
      <input id="np-lookup" placeholder="例如：9780306821165，或 Dirigible Dreams Hiam"
             style="margin-bottom:0" onkeydown="if(event.key==='Enter')lookupBook()">
      <button class="secondary" onclick="lookupBook()">🔍 查詢</button>
    </div>
    <div id="np-results" style="margin:.4rem 0"></div>
    <label>書名</label><input id="np-title">
    <label>作者</label><input id="np-author">
    <label>預估頁數 <span class="meta">（選填）</span></label>
    <input id="np-pages" type="number">
    <div class="meta" id="np-extra" style="margin-bottom:.6rem"></div>
    <button onclick="createProject()">建立專案</button>
    <div class="meta" style="margin-top:.5rem">建立專案後再新增影片、PDF 或相片——
      這是下一步。專案的資料夾名稱會根據書名自動產生，因此您只需處理書名即可。</div>
  </div>`;
}

async function lookupBook() {
  const q = $("np-lookup").value.trim();
  const box = $("np-results");
  if (q.length < 3) { box.innerHTML = t("<div class='meta'>請輸入書名、作者或 ISBN</div>"); return; }
  box.innerHTML = t("<div class='meta'>搜尋中…</div>");
  let r;
  try { r = await api("/lookup?q=" + encodeURIComponent(q)); }
  catch (e) { box.innerHTML = T`<div class='meta'>查詢失敗：${esc(e.message)}</div>`; return; }
  if (!r.results.length) { box.innerHTML = t("<div class='meta'>找不到相符項目 — 請手動填寫欄位</div>"); return; }
  box.innerHTML = r.results.map((b, i) => `
    <div class="row" style="border:1px solid var(--line);border-radius:6px;
         padding:.4rem .6rem;margin:.25rem 0;cursor:pointer" onclick='pickBook(${i})'>
      ${b.cover_url ? `<img src="${esc(b.cover_url)}" style="height:48px;border-radius:3px">` : ""}
      <div style="flex:1;min-width:10rem">
        <b>${esc(b.title || "")}</b>
        <div class="meta" style="margin:0">${esc([b.author, b.year, b.pages && b.pages+"pp",
          b.isbn].filter(Boolean).join(" · "))}</div>
      </div>
    </div>`).join("");
  window._lookup = r.results;
}
function pickBook(i) {
  const b = (window._lookup || [])[i]; if (!b) return;
  if (b.title) $("np-title").value = b.title;
  if (b.author) $("np-author").value = b.author;
  if (b.pages) $("np-pages").value = b.pages;
  npMeta = {isbn: b.isbn || null, publisher: b.publisher || null, year: b.year || null};
  $("np-extra").textContent = [b.publisher, b.year, b.isbn && "ISBN " + b.isbn]
    .filter(Boolean).join(" · ");
  $("np-results").innerHTML = t("<div class='meta'>✓ 已帶入「") + esc(b.title) + t("」</div>");
}

// provider <option> labels: the value stays the provider id
function providerLabel(p) {
  return {codex: t("codex — ChatGPT 訂閱"), claude_cli: t("claude_cli — Claude 訂閱"),
          agy: t("agy — Antigravity 訂閱")}[p] || p;
}
const providerOption = (p, sel) =>
  `<option value="${p}" ${p === sel ? "selected" : ""}>${providerLabel(p)}</option>`;

// one status line per subscription CLI, with its model dropdown. The <select>
// starts with just the stored value (so saving before the list arrives keeps
// it); loadCliModels() fills it in.
const CLI_EFFORTS = ["low", "medium", "high", "xhigh"];
const cliOption = (v, text, sel) =>
  `<option value="${esc(v)}" ${v === sel ? "selected" : ""}>${esc(text)}</option>`;

function cliStatusRow(name, s) {
  const ok = (s.cli_available || {})[name];
  const inst = ok ? t('<span class="badge ok">已安裝</span>')
                  : t('<span class="badge suspect">未安裝</span>');
  let login = t("使用該 CLI 既有的登入");
  if (name === "codex") {
    login = s.codex_logged_in ? t('<span class="badge ok">已登入</span>')
      : T`<span class="badge acceptable">尚未登入</span> 請在終端機執行一次：<code style="word-break:break-all">${esc(s.codex_login_cmd)}</code>`;
  }
  const cur = s[name + "_model"] || "";
  const effort = name !== "codex" ? "" : `
      <label style="margin:0">${t("推理強度")}</label>
      <select id="set-effort-codex" style="width:auto;margin:0">${
        [...new Set([...CLI_EFFORTS, s.codex_effort || "low"])]
          .map(e => cliOption(e, e, s.codex_effort || "low")).join("")}</select>`;
  return `<div class="meta" style="margin:.2rem 0"><b>${providerLabel(name)}</b>
    ${inst} · ${login}</div>
    <div class="row" style="flex-wrap:wrap;align-items:center;margin:0 0 .6rem">
      <label style="margin:0">${t("模型")}</label>
      <select id="set-model-${name}" style="width:auto;max-width:100%;margin:0">${
        cliOption(cur, cur || t("CLI 預設模型"), cur)}</select>${effort}
    </div>`;
}

function cliSettingsCard(s) {
  return T`<hr style="border:0;border-top:1px solid var(--line);margin:.9rem 0">
    <label>訂閱 CLI（使用 ChatGPT / Claude / Antigravity 訂閱額度）</label>
    ${["codex", "claude_cli", "agy"].map(n => cliStatusRow(n, s)).join("")}
    <div class="row" style="flex-wrap:wrap">
      <div><label>同時處理頁數 <span class="meta">（1–4）</span></label>
        <input id="set-cliconc" type="number" min="1" max="4" step="1"
               value="${s.cli_concurrency}" style="width:6rem"></div>
      <div><label>單頁逾時秒數 <span class="meta">（60–1800）</span></label>
        <input id="set-clitimeout" type="number" min="60" max="1800" step="10"
               value="${s.cli_timeout}" style="width:6rem"></div>
    </div>

function uploadXHR(url, fd, onProgress) {
  // fetch() has no upload progress; phone videos are GB-scale, so show one
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    x.open("POST", url);
    x.upload.onprogress = e => {
      if (e.lengthComputable && onProgress)
        onProgress(Math.round(100 * e.loaded / e.total));
    };
    x.onload = () => x.status < 300
      ? resolve(JSON.parse(x.responseText))
      : reject(new Error(x.responseText || x.statusText));
    x.onerror = () => reject(new Error(t("上傳時發生網路錯誤")));
    x.send(fd);
  });
}

let jobsBaseTimer = null, jobsModalTimer = null;
function jobsModalOpen() {
  const m = $("jobs-modal"); return m && m.style.display === "flex";
}
function prettyJob(j) {
  const base = j.label || ({pipeline: t("執行處理流程"), "proof-chapter": t("校對"),
    "proof-resolve": t("重新辨識段落"), "proof-reread-stuck": t("重新辨識卡住項目"),
    "retry-ocr": t("重試 OCR"), "pdf-import": t("PDF 匯入"),
    "video-import": t("影片匯入"), "epub-import": t("EPUB 匯入"), audiobook: t("製作有聲書"),
    "cast-analysis": t("分析角色"), "tts-preview": t("聲音預覽"), "voice-gen": t("產生聲音"),
    "voice-gen-all": t("產生所有缺少的聲音")}[j.kind] || j.kind);
  // the queue is global (all books), so name the book
  return j.project ? `${j.project} · ${base}` : base;
}
function jobElapsed(startedAt) {
  if (!startedAt) return "";
  const s = Math.max(0, Math.round(Date.now() / 1000 - startedAt));
  return s < 90 ? T`${s} 秒` : T`${Math.floor(s / 60)} 分 ${s % 60} 秒`;
}
function updateJobsChip(jobs) {
  const chip = $("jobs-chip"); if (!chip) return;
  const running = jobs.filter(j => j.status === "running");
  const queued = jobs.filter(j => j.status === "queued");
  if (!running.length && !queued.length) { chip.style.display = "none"; return; }
  chip.style.display = "block";
  // several jobs can run at once (tts / proof / import lanes are independent)
  const label = running.length > 1 ? T`${running.length} 個執行中`
    : running.length ? esc(prettyJob(running[0])) : t("啟動中…");
  chip.innerHTML = `<span class="spin">⚙</span> ${label}`
    + (queued.length ? T` · +${queued.length} 排隊中` : "");
}
// one global poller for the whole queue (all books) — never reset on switch
function startJobsPolling() {
  if (jobsBaseTimer) return;
  const tick = async () => {
    let jobs;
    try { jobs = (await api(`/jobs`)).jobs || []; } catch { return; }
    updateJobsChip(jobs);
    if (jobsModalOpen()) renderJobsModal(jobs);
  };
  tick();
  jobsBaseTimer = setInterval(tick, 2500);
}
function openJobsModal() {
  $("jobs-modal").style.display = "flex";
  clearInterval(jobsModalTimer);
  const tick = async () => {
    let jobs;
    try { jobs = (await api(`/jobs`)).jobs || []; } catch { return; }
    renderJobsModal(jobs); updateJobsChip(jobs);
  };
  tick();
  jobsModalTimer = setInterval(tick, 1200);
}
function closeJobsModal() {
  $("jobs-modal").style.display = "none";

}
async function renderJobsModal(jobs) {
  const box = $("jobs-body"); if (!box) return;
  const running = jobs.filter(j => j.status === "running");
  const queued = jobs.filter(j => j.status === "queued");
  const recent = jobs.filter(j => ["done", "error", "canceled"].includes(j.status)).slice(0, 8);
  const icon = {done: "✓", error: "✗", canceled: "⊘"};
  // one card PER running job — the lanes run several at once (an audiobook
  // narrating while a cast analysis or proofread runs is normal)
  let runHtml = "";
  for (const j of running) {
    let tail = t("處理中…");
    try {
      const { logs } = await api(`/jobs/${j.id}/logs`);
      if (logs && logs.length) tail = logs.slice(-10).map(l => esc(l.line)).join("\n");
    } catch {}
    runHtml += T`<div class="card" style="border:2px solid var(--accent)">
      <div class="row" style="align-items:center">
        <span class="spin">⚙</span> <b>${esc(prettyJob(j))}</b>
        <span class="meta" style="margin:0">已執行 ${jobElapsed(j.started_at)}</span>
        <button class="secondary" style="margin-left:auto;padding:.2rem .6rem"
          onclick="cancelJob(${j.id})">取消</button>
      </div>
      <pre style="max-height:200px;overflow:auto;background:#0c0a09;color:#d6d3d1;
        padding:.5rem;border-radius:6px;font-size:.72rem;white-space:pre-wrap;
        margin:.5rem 0 0">${tail}</pre></div>`;
  }
  const queuedHtml = queued.length ? T`<div class="card">
    <b>排隊中 (${queued.length})</b>
    <ol style="margin:.3rem 0 0;padding-left:1.3rem">${queued.map(j =>
      `<li style="margin:.2rem 0">${esc(prettyJob(j))}
        <button class="secondary" style="padding:.1rem .5rem;font-size:.7rem"
          onclick="cancelJob(${j.id})">✕</button></li>`).join("")}</ol></div>` : "";
  const recentHtml = T`<div class="card"><b>最近工作</b>${recent.length
    ? `<ul style="margin:.3rem 0 0;padding-left:1.1rem;list-style:none">${recent.map(j =>
        `<li style="margin:.2rem 0">${icon[j.status] || ""} ${esc(prettyJob(j))}
          <span class="meta" style="margin:0">— ${lbl(j.status)}${
            j.error ? t("：") + esc(j.error.slice(0, 70)) : ""}</span></li>`).join("")}</ul>`
    : T`<div class="meta">尚無已完成的工作</div>`}</div>`;
  box.innerHTML = (runHtml || (queued.length ? ""
    : T`<div class="card"><div class="meta">目前沒有正在執行的工作。</div></div>`))
    + queuedHtml + recentHtml;
}
async function cancelJob(id) {
  try { await api(`/jobs/${id}/cancel`, {method: "POST"}); }
  catch (e) { /* already finished — ignore */ }
  if (jobsModalOpen()) {

  }
}

  if (p.running) attachEvents(name);
  startProgress(name);
  startJobsPolling();

}

function wizardCardHtml(items, anyPages) {
  // honest breakdown of what the wizard will actually walk
  const n = (k) => (items || []).filter(i => i.kind === k).length;
  const parts = [];
  if (n("missing")) parts.push(T`${n("missing")} 個未拍攝頁面${n("missing") > 1 ? "" : ""}`);
  if (n("reshoot")) parts.push(T`${n("reshoot")} 個建議重拍的欠佳拍攝畫面${n("reshoot") > 1 ? "" : ""}`);
  if (n("figure")) parts.push(T`${n("figure")} 個圖表特寫${n("figure") > 1 ? "" : ""}`);
  const desc = !anyPages
    ? t("目前尚無頁面 — 請逐頁拍攝整本書（系統會詢問最後一頁的頁碼）")
    : parts.length
    ? T`${parts.join(" + ")} — 依頁碼順序逐一處理；文字辨識會在最後統一執行一次`
    : t("書籍看似完整 — 精靈佇列中無待處理項目");
  return T`
    <div class="card" style="background:#f0fdfa;border:2px solid var(--accent)">
      <div class="row">
        <div style="flex:1;min-width:14rem">
          <h2 style="margin-bottom:.2rem">📷 補拍精靈</h2>
          <div class="meta">${desc}</div>
        </div>
        <span class="row">
          <button style="font-size:1.05rem;padding:.7rem 1.4rem"
                  onclick="startWizard()">${!anyPages ? t("拍攝整本書")
                                            : t("依頁碼拍攝")}</button>
          ${anyPages ? T`<button class="secondary" onclick="startUnidentifiedWizard()">
            未識別頁面…</button>` : ""}
        </span>
      </div>
    </div>`;
}

function addPagePanel() {

        <select id="addpage-pos" style="width:auto">

function renderTab(tab, p) {
  const name = p.name, body = $("tabbody");
  if (tab === "pipeline") {
    // each call degrades to an empty result so one failing/not-yet-deployed
    // endpoint can never blank the whole pipeline tab
    Promise.all([api("/projects/" + name + "/reshoot").catch(() => ({items: [], missing: []})),
                 api(`/projects/${name}/capture-queue`).catch(() => ({items: []})),
                 api(`/projects/${name}/crop-list`).catch(() => ({items: []})),
                 api(`/projects/${name}/reocr-list`).catch(() => ({items: []}))]).then(([r, q, cl, ro]) => {
      const items = r.items || [];
      const anyPages = (p.pages || []).some(x => !x.role);
      const wizardCard = wizardCardHtml(q.items, anyPages);
      const missingCard = r.missing && r.missing.length ? T`
        <div class="card" style="border:2px solid #f59e0b">
          <h2>缺頁 — 從未拍攝</h2>
          <p>實體頁碼 <b>${esc(r.missing_ranges)}</b>（${r.missing.length} 頁）未出現在任何影片中。請錄製書本的這些部分（任何方向皆可）並使用
          <b>+ 新增影片</b>，或使用上方的補拍精靈進行拍攝。</p>
        </div>` : "";
      const cropItems = cl.items || [];
      const nCrops = cropItems.reduce((s, it) => s + it.regions.length, 0);
      const cropCard = T`<div class="card" style="border:2px solid #6366f1">
        <div class="row" style="margin-bottom:.4rem">
          <h2 style="margin:0">✂ 裁切清單 — 需要裁切的區塊</h2>
          ${cropItems.length ? T`<button style="margin-left:auto"
             onclick="startCropReview()">✂ 定義裁切 (${nCrops})…</button>` : ""}
        </div>
        <div class="meta">模型標記但尚未裁切的圖表 —
          逐頁檢視並繪製外框（或使用 ✨ 智慧裁切）。僅有可略過品質備註的頁面也會包含於此。</div>`
        + (cropItems.length ? "<ul>" + cropItems.map(it =>
            T`<li><a href="javascript:void(0)" onclick="gotoPage('${it.id}')"><b>${it.id}</b>${
              it.printed_number ? T`（頁碼 ${it.printed_number}）` : ""}</a> — ${
              it.regions.length} 個區塊${
              it.suspect ? T` <span class="meta">· 頁面亦被標記</span>` : ""}</li>`).join("")
            + "</ul>"
          : t("<div class='meta'>目前為空 — 所有區塊皆已裁切</div>")) + `</div>`;
      const reocrItems = ro.items || [];
      const reocrCard = reocrItems.length ? T`<div class="card" style="border:2px solid #dc2626">
        <div class="row" style="margin-bottom:.4rem">
          <h2 style="margin:0">⚠ 重新辨識清單 — 辨識失敗</h2>
          <button style="margin-left:auto" onclick="reocrAll()">↻ 全部重新辨識 (${reocrItems.length})</button>
        </div>
        <div class="meta">模型無法辨識的頁面 — 重新辨識會透過分割與復原程序重試（於工作佇列中執行）。若之後仍失敗，可能確實需要重拍。</div>
        <ul>${reocrItems.map(it => `<li>
          <a href="javascript:void(0)" onclick="gotoPage('${it.id}')"><b>${it.id}</b>${
            it.printed_number ? T`（頁碼 ${it.printed_number}）` : ""}</a>
          ${it.can_reocr
            ? T`<button class="secondary" style="padding:.1rem .5rem;font-size:.7rem"
                 onclick="reocrOne('${it.id}')">↻ 重新辨識</button>`
            : T`<span class="meta">· 請先執行處理流程</span>`}
          <span class="meta"> — ${esc(it.error)}</span></li>`).join("")}</ul>
      </div>` : "";
      body.innerHTML = wizardCard + missingCard + reocrCard + cropCard
        + T`<div class="card"><div class="row" style="margin-bottom:.4rem">
            <h2 style="margin:0">重拍清單 — 拍攝品質不佳</h2>
            ${items.length ? T`<button style="margin-left:auto"
               onclick="startReshootReview()">🔍 審閱這些項目 (${items.length})…</button>` : ""}
           </div>
           <div class="meta">在執行補拍精靈之前，逐一翻閱各個標記的頁面並確認或略過</div>` + (items.length
        ? "<ul>" + items.map(i =>
            `<li><a href="javascript:void(0)" onclick="gotoPage('${i.id}')"><b>${i.id}</b>${
              i.printed_number ? T`（頁碼 ${i.printed_number}）` : ""}</a>
             — ${esc(i.reasons.join(", "))}</li>`).join("") + "</ul>"
        : t("<div class='meta'>目前為空 — 所有頁面看起來皆正常</div>")) + `</div>`;
    });
  } else if (tab === "media") {
    const photoPages = p.pages.filter(pg => pg.patched_source);
    api(`/projects/${name}/capture-queue`).then(q => {
      const holder = $("media-wizard");
      if (holder) holder.innerHTML = wizardCardHtml(
        q.items, (p.pages || []).some(x => !x.role));
    });
    body.innerHTML = `<div id="media-wizard"></div>` + T`
      <div class="card">
        <h2>新增媒體</h2>
        <div class="row" style="margin-bottom:.6rem">
          <input type="file" accept="video/*" id="addvideo-file" style="display:none"
                 onchange="addVideoToProject()">
          <button onclick="$('addvideo-file').click()"
                  ${p.running ? "disabled" : ""}>+ 新增影片</button>
          <input type="file" accept="application/pdf,.pdf" id="addpdf-file"
                 style="display:none" onchange="addPdfToProject()">
          <button class="secondary" onclick="$('addpdf-file').click()"
                  ${p.running ? "disabled" : ""}>+ 新增 PDF</button>
          <input type="file" accept="application/epub+zip,.epub" id="addepub-file"
                 style="display:none" onchange="addEpubToProject()">
          <button class="secondary" onclick="$('addepub-file').click()"
                  title="匯入現有 EPUB — 章節將轉為可編輯頁面，
無需 OCR；可直接編輯、重新匯出或朗讀為有聲書"
                  ${p.running ? "disabled" : ""}>+ 新增電子書 (EPUB)</button>
          <span class="meta">拍攝書本，或匯入該書的 PDF — 每個 PDF
            頁面都會成為此處的頁面；新增後請執行處理流程</span>
        </div>
      </div>
      ${addPagePanel()}
      <div class="card" id="storage-card">
        <h2>儲存空間與清理</h2>
        <div class="meta">正在載入容量大小…</div>
      </div>
      <div class="card">
        <h2>影片 (${p.videos.length})</h2>
        ${p.videos.map(v => T`
          <div class="row" style="border-top:1px solid var(--line);padding:.6rem 0">
            <div style="flex:1;min-width:12rem">
              <b>${v.id}</b> <span class="meta">·
                ${esc((v.source || v.path).split(/[\\\\/]/).pop())}</span>
              <div class="meta">${v.fps_actual} fps · ${v.nb_frames ?? "?"} 影格 ·
                ${v.duration ? Math.round(v.duration) + t(" 秒") : ""}
                ${v.rotate === 180 ? t(" · 已旋轉 180°") : ""}</div>
            </div>
            <label style="display:flex;align-items:center;gap:.3rem">
              <input type="checkbox" style="width:auto;margin:0"
                     ${v.rotate === 180 ? "checked" : ""}
                     onchange="setRotate('${v.id}', this.checked)">
              上下顛倒拍攝</label>
          </div>`).join("") || t("<div class='meta'>尚無影片</div>")}
      </div>
      <div class="card">
        <h2>頁面照片 (${photoPages.length})</h2>
        ${photoPages.map(pg => `
          <div class="row" style="border-top:1px solid var(--line);padding:.6rem 0">
            <img loading="lazy" decoding="async"
                 src="/api/projects/${name}/thumb/${pg.patched_source}?w=260${fv(pg.patched_source)}"
                 style="height:90px;border:1px solid var(--line);border-radius:4px">
            <div style="flex:1;min-width:10rem">
              <a href="javascript:void(0)" onclick="gotoPage('${pg.id}')"><b>${pg.id}</b></a>
              <span class="badge ${pg.status}">${lbl(pg.status)}</span>
              ${pg.role === "cover" ? t('<span class="badge ok">封面</span>') : ""}
              <div class="meta">${pg.printed_number != null
                ? t("頁碼 ") + pg.printed_number : t("無頁碼")}</div>
            </div>
          </div>`).join("")
          || t("<div class='meta'>尚未新增照片 — 請使用上方的「從照片新增頁面」") +
             t("來加入封面、蝴蝶頁文字或遺漏的頁面</div>")}
      </div>`;
    renderStorage(name);
  } else if (tab === "pages") {
    // unsaved markdown edits must survive re-renders (section change, ignore,
    // crop save, page links all rebuild this tab)
    const dirtyMd = {};
    document.querySelectorAll('textarea[id^="md-"]').forEach(ta => {
      if (ta.dataset.dirty) dirtyMd[ta.id] = ta.value;
    });
    freshFiltersFor(name);   // fresh project -> fresh filters (shared with figures)
    // assign every page to a chapter: printed-TOC ranges for numbered pages,
    // manual section marks always win, unnumbered pages inherit from the
    // previous page (book order)
    // prefer the backend-computed chapter (matches the built book, cover
    // included); fall back to printed-TOC ranges when the book hasn't
    // assembled yet
    const haveCh = p.pages.some(pg => pg.chapter);
    const toc = (p.toc || []).slice().sort((a, b) => a.start - b.start);
    const chapterOfNum = (n) => {
      let c = t("正文前頁");
      for (const e of toc) { if (n >= e.start) c = e.title; else break; }
      return c;
    };
    let curCh = t("正文前頁");
    const chapters = [];
    p.pages.forEach(pg => {
      if (haveCh) {
        pg._chapter = pg.chapter || t("正文前頁");
      } else {
        if (pg.section) curCh = pg.section;
        else if (toc.length && pg.printed_number != null && pg.printed_number >= 1
                 && pg.status !== "duplicate" && pg.status !== "deleted")
          curCh = chapterOfNum(pg.printed_number);
        pg._chapter = pg.role === "cover" ? t("封面") : curCh;
      }
      if (!chapters.includes(pg._chapter)) chapters.push(pg._chapter);
    });
    const flt = pageFilters;
    // a chapter chosen on the figures tab may have no pages here — keep it in the
    // list so the shared filter stays visible/selected across the two tabs
    const pageChapterOpts = chapterFilter && !chapters.includes(chapterFilter)
      ? [...chapters, chapterFilter] : chapters;
    const shown = p.pages.filter(pg =>
      (!chapterFilter || pg._chapter === chapterFilter)
      && (!flt.unnumbered || (pg.printed_number == null && !pg.role)));
    const toolbar = T`<div class="card" style="padding:.7rem 1.5rem">
      <div class="row">
        <label style="margin:0">章節</label>
        <select style="width:auto;margin:0"
          onchange="chapterFilter=this.value;renderTab('pages',window._proj)">
          <option value="">全部</option>
          ${pageChapterOpts.map(c => `<option ${chapterFilter === c ? "selected" : ""}
             value="${esc(c)}">${esc(c)}</option>`).join("")}
        </select>
        <label style="margin:0;display:flex;align-items:center;gap:.3rem">
          <input type="checkbox" style="width:auto;margin:0"
                 ${flt.unnumbered ? "checked" : ""}
                 onchange="pageFilters.unnumbered=this.checked;renderTab('pages',window._proj)">
          僅無頁碼</label>
        <span class="meta" style="margin:0 0 0 auto">${shown.length}
          / ${p.pages.length} 頁</span>
      </div></div>`;
    // inline gap markers: two sequential known pages that aren't consecutive
    // mean the pages between them were never captured
    let lastNum = null;
    const gapBefore = (pg) => {
      if (pg.status === "duplicate" || pg.status === "deleted" || pg.role) return "";
      const n = pg.printed_number;
      if (n == null || n < 1) return "";
      let out = "";
      if (lastNum != null && n > lastNum + 1) {
        const a = lastNum + 1, b = n - 1;
        out = T`<div class="card" style="border:2px dashed #f59e0b;background:#fffbeb;
                 padding:.5rem 1.5rem;display:flex;gap:.8rem;align-items:center">
          <span style="color:#b45309"><b>缺頁：</b>第
            ${b > a ? a + "–" + b : a} 頁 — 從未拍攝</span>
          <span class="meta" style="margin:0 0 0 auto">錄製書本的這部分並新增影片，或新增照片（媒體標籤頁）</span>
        </div>`;
      }
      lastNum = n;
      return out;
    };
    // work through the book section by section: a jump to the next one
    const nextCh = flt.chapter
      ? chapters[chapters.indexOf(flt.chapter) + 1] : null;
    const nextBtn = flt.chapter ? `
      <div class="card" style="text-align:center">
        ${nextCh ? T`<button style="font-size:1rem;padding:.7rem 1.6rem"
            onclick="nextSection('${esc(nextCh)}')">下一節：${esc(nextCh)} →</button>`
          : T`<span class="meta">最後一節 — 全書已檢視完畢</span>`}
      </div>` : "";
    body.innerHTML = toolbar
      + shown.map(pg => gapBefore(pg) + (pg2html(pg))).join("")
      + nextBtn + cropModalHtml();
    for (const [id, val] of Object.entries(dirtyMd)) {
      const ta = $(id);
      if (ta) {
        ta.value = val;
        ta.dataset.dirty = 1;
        const b = $("mdsave-" + id.slice(3));
        if (b) { b.textContent = t("儲存 Markdown *"); b.disabled = false; }
      }
    }
    function pg2html(pg) {
      const collapsed = pg.status === "deleted" || pg.status === "duplicate";
      const numLabel = pg.printed_number != null
        ? t("頁碼 ") + pg.printed_number + (pg.number_inferred ? t(" (推斷)") : "")
          + (pg.number_manual ? t(" (手動)") : "")
        : t("無頁碼");
      // an ignored suspect is "acceptable" (orange), never a clean green ok —
      // and it keeps a note of what the complaint was
      const accepted = pg.suspect_ignored && pg.status === "ok";
      const badge = accepted
        ? T`<span class="badge acceptable"
             title="曾被標記為可疑 — 經審閱後已接受">可接受</span>`
        : `<span class="badge ${pg.status}">${lbl(pg.status)}</span>`;
      // row 1: identity + page-number reassignment
      const header = `
        <div class="row" style="padding:.15rem 0">
          ${badge}
          ${pg.role === "cover" ? T`<span class="badge patched"
             title="此頁為書籍封面圖片（作為 EPUB 封面使用）"
             style="font-weight:600">📕 封面</span>` : ""}
          <b>${pg.id}</b>
          ${pg.section ? T`<span class="badge ok" style="cursor:pointer"
             title="此頁為章節開頭（點擊以編輯）"
             onclick="setSection('${pg.id}')">§ ${esc(pg.section)}</span>` : ""}
          <span class="meta" style="margin:0">${numLabel}
            ${pg.confidence ? t(" · 信心度") + lbl(pg.confidence) : ""}
            ${pg.needs_reshoot ? t(" · 📷 重拍") : ""}
            ${pg.reasons?.length
              ? ` · <span style="color:#b45309">⚠ ${esc(pg.reasons.join("; "))}</span>`
                + (pg.transcribe_error
                  ? T` <button class="secondary" style="padding:.1rem .5rem;font-size:.7rem"
                       title="立即在此頁重新執行 OCR"
                       onclick="retryOcr('${pg.id}', this)">↻ 重試 OCR</button>` : "")
                + (pg.status === "suspect"
                  ? T` <button class="secondary" style="padding:.1rem .5rem;font-size:.7rem"
                       title="頁面其實沒問題 — 清除可疑標記"
                       onclick="ignoreSuspect('${pg.id}')">忽略</button>` : "") : ""}
            ${accepted ? T` · <span style="color:#c2410c" title="原始標記原因">
              原為：${esc((pg.ignored_reasons || [t("曾標記為可疑")]).join("; "))}
              — 已由您忽略</span>` : ""}</span>
          <span class="row" style="margin-left:auto">
            ${collapsed ? T`
              ${pg.status === "duplicate" ? T`<button class="secondary"
                 onclick="unduplicate('${pg.id}')">非重複</button>` : ""}
              ${pg.status === "deleted" ? T`<button class="secondary"
                 onclick="restorePage('${pg.id}')">取消隱藏</button>` : ""}
              <button class="secondary" onclick="toggleCell('${pg.id}')"
                      id="tgl-${pg.id}">展開 ▾</button>`
            : T`<label style="margin:0">頁碼</label>

                      style="width:5.5rem;margin:0" onchange="setPageNumber('${pg.id}')">`}
          </span>
        </div>`;
      const figs = (pg.figures || []).map((f, i) => T`
        <span style="display:inline-flex;flex-direction:column;align-items:center;
                     gap:2px;vertical-align:top">
          <span class="meta" title="${esc(f)} — 對應「圖表」分頁中此圖表的圖說" style="margin:0;font-size:.62rem;font-family:monospace;
                     max-width:92px;overflow:hidden;text-overflow:ellipsis;
                     white-space:nowrap">${esc(f.split("/").pop())}</span>
          <img loading="lazy" decoding="async"
               src="/api/projects/${name}/thumb/${f}?w=260${fv(f)}"
               style="height:90px;border:1px solid var(--line);border-radius:4px;
                      cursor:crosshair"
               title="點擊以重新裁切" onclick="openCrop('${pg.id}', ${i}, 'pages')">
          <span style="display:flex;gap:2px">
            <button class="secondary" style="padding:.15rem .5rem;font-size:.7rem"
                    onclick="openCrop('${pg.id}', ${i}, 'pages')">重新裁切</button>

          </span>

        // regions whose figure crop never happened: offer to draw one
        + (pg.regions || []).map((r, ri) => {
            const expected = `figures/${pg.id}_${String.fromCharCode(97 + ri % 26)}.png`;

      return T`
      <div class="card ${pg.status}${accepted ? " accepted" : ""}" id="cell-${pg.id}">
        ${header}
        <div class="pagerow-body" style="${collapsed ? "display:none" : ""}">
          <div class="pagegrid">
            <div>
              ${pg.color ? `<img loading="lazy" decoding="async" style="width:100%;
                 border:1px solid var(--line);border-radius:4px"
                 src="/api/projects/${name}/thumb/${pg.color}?w=${thumbW()}${fv(pg.color)}">` : ""}
              ${figs ? `<div class="row" style="margin-top:.4rem">${figs}</div>` : ""}
            </div>
            <div>
              <textarea id="md-${pg.id}" data-page="${pg.id}"
                placeholder="${pg.md ? "" : pg.status === "patched"
                  ? t("尚未辨識 — 在「處理流程」分頁點擊「執行 / 繼續」以辨識此新照片")
                  : t("尚無辨識結果")}"
                oninput="this.dataset.dirty=1;
                         const b=$('mdsave-${pg.id}');
                         b.textContent='儲存 Markdown *';b.disabled=false"></textarea>
              <div class="row" style="margin-top:.4rem">
                <button id="mdsave-${pg.id}" onclick="saveMd('${pg.id}')">儲存 Markdown</button>
                <button class="secondary" title="將硬換行的文字重整為流暢的段落 — 修復逐行辨識的欄位文字（請先審閱再儲存）"
                  onclick="reflowMd('${pg.id}')">⤸ 重排</button>
              </div>
            </div>
          </div>
          <div class="row" style="border-top:1px solid var(--line);margin-top:.8rem;
               padding-top:.7rem">
            <input type="file" id="patch-${pg.id}" style="display:none"
                   onchange="patchPage('${pg.id}')">
            <button class="secondary" onclick="$('patch-${pg.id}').click()">
              替換照片並重新處理…</button>
            <button class="secondary" onclick="toggleReshoot('${pg.id}', ${!pg.needs_reshoot})">
              ${pg.needs_reshoot ? t("取消重拍標記") : t("標記為需重拍")}</button>
            <button class="secondary" title="將此頁設為章節開頭"

            <button class="secondary" title="將此頁圖片設為書籍封面"
              onclick="setCover('${pg.id}', ${pg.role !== "cover"})">${
              pg.role === "cover" ? t("📕 取消封面") : t("📕 設為封面")}</button>
            <button class="secondary" title="為模型在此頁遺漏的插圖框選裁切範圍" onclick="openCrop('${pg.id}',
              ${(pg.regions || []).length}, 'pages', true)">＋ 新增圖表</button>
            ${pg.patched_source ? T`<button class="secondary"
              title="照片拍顛倒了？旋轉 180 度並重新處理"
              onclick="rotatePage('${pg.id}')">↻ 180°</button>
            <button class="secondary" title="使用邊角控制點裁切此頁照片 — 特別適用於封面" onclick="openPageCrop('${pg.id}')">
              ✂ 裁切頁面</button>` : ""}
            ${pg.status === "duplicate"
              ? T`<button class="secondary" onclick="unduplicate('${pg.id}')">非重複</button>`
              : T`<button class="secondary" onclick="markDuplicate('${pg.id}')">標記為重複</button>`}
            ${pg.status === "deleted"
              ? T`<button class="secondary" onclick="restorePage('${pg.id}')">取消隱藏</button>`
              : T`<button class="danger" onclick="deletePage('${pg.id}')">隱藏</button>`}
          </div>
        </div>
      </div>`;
    }
    (async () => {   // fill the markdown editors a few at a time — hundreds
      const queue = shown.filter(pg => pg.md);   // of parallel fetches choke
      const worker = async () => {               // phone browsers
        while (queue.length) {
          const pg = queue.shift();
          const el = $("md-" + pg.id);
          if (!el) continue;
          try {
            const r = await fetch(`/api/projects/${name}/file/${pg.md}`);
            if (r.ok) {
              const md = await r.text();
              const e = $("md-" + pg.id);
              // NEVER overwrite an editor the user has touched or is in —
              // this race used to eat in-progress edits
              if (e && !e.dataset.dirty && document.activeElement !== e)
                e.value = md;
            }
          } catch {}
        }
      };
      await Promise.all(Array.from({length: 4}, worker));
    })();
    try {   // hand-off from the EPUB reader's per-figure ✂ re-crop button
      const pend = JSON.parse(localStorage.getItem("flipscan-open-crop") || "null");
      if (pend && pend.project === name) {
        localStorage.removeItem("flipscan-open-crop");
        openCrop(pend.pageId, pend.figIdx, "pages");
      }
    } catch {}
  } else if (tab === "frames") {
    body.innerHTML = T`<div class="card"><h2>標準影格（印樣）</h2>

        ? `<img style="max-width:100%" src="/api/projects/${name}/file/work/contact_sheet.jpg">`
        : t("<div class='meta'>請先執行處理流程</div>")}</div>`;
  } else if (tab === "contents") {
    // the effective chapter list the built book uses: one entry per distinct
    // chapter title (a manual section heading, else the heading assemble
    // detected), at the first page it appears on
    const chapters = [];
    const seenCh = new Set();
    for (const pg of (p.pages || [])) {
      if (pg.role) continue;
      const ch = ((pg.section || pg.chapter) || "").trim();
      if (!ch || ch === "Front matter" || ch === "Cover" || seenCh.has(ch)) continue;
      seenCh.add(ch);
      chapters.push({id: pg.id, title: ch, printed_number: pg.printed_number,
                     fromSection: !!pg.section});
    }
    window._chapters = chapters;   // pass titles by index (avoids quote escaping)
    const sup = p.suppressed_headings || {};
    window._hiddenHeadings = Object.entries(sup)
      .flatMap(([pid, titles]) => (titles || []).map(title => ({pageId: pid, title})));
    const toc = p.toc || [];
    // first open with no chapters but a printed contents page → seed it once
    if (!chapters.length && toc.length && !contentsAutodetected[name]) {
      contentsAutodetected[name] = true;
      body.innerHTML = T`<div class="card"><div class="meta">正在從印刷目錄頁偵測章節…</div></div>`;
      contentsAutodetect(false, false);
      return;
    }
    const pageOpts = (p.pages || [])
      .filter(pg => !pg.role && pg.status !== "duplicate" && pg.status !== "deleted")
      .map(pg => `<option value="${pg.id}">${pg.id}${
        pg.printed_number != null ? T` — 印刷頁碼 ${pg.printed_number}` : ""}</option>`).join("");
    body.innerHTML = T`
      <div class="card">
        <div class="row" style="margin-bottom:.4rem">
          <h2 style="margin:0">目錄</h2>
          ${toc.length ? T`<button class="secondary" style="margin-left:auto"
              onclick="contentsAutodetect(false, true)"
              title="從印刷目錄頁填入尚未設定的章節"
              >↻ 從印刷目錄偵測</button>
            <button class="secondary" onclick="contentsAutodetect(true, true)"
              title="同時覆寫現有的章節起始位置">全部取代</button>` : ""}
        </div>
        <div class="meta" style="margin-bottom:.7rem">本書章節依序排列。每個章節對應<b>起始頁上的章節標題</b> — 在此編輯標題將同步更新該頁面。「頁面」篩選條件、「校對」分頁與 EPUB 均採用相同結構，因此章節位置會依循其起始頁。</div>
        ${chapters.length ? `<ol style="padding-left:1.3rem;margin:.2rem 0">
          ${chapters.map((ch, ci) => T`<li style="margin:.4rem 0">
            <div class="row" style="gap:.5rem;align-items:center">
              <input value="${esc(ch.title)}" style="flex:1;margin:0"
                onchange="renameChapter('${ch.id}', this.value)">
              ${ch.fromSection
                ? T`<span class="badge ok" title="由您設定的標題">手動</span>`
                : T`<span class="meta" title="從頁面本身的標題偵測">標題</span>`}
              <a href="javascript:void(0)" class="meta" style="white-space:nowrap"
                onclick="gotoPage('${ch.id}')" title="前往此頁面"
                >${ch.printed_number != null ? T`第 ${ch.printed_number} 頁` : ch.id} ↗</a>
              <button class="secondary" style="padding:.2rem .55rem"
                onclick="${ch.fromSection
                  ? `removeChapter('${ch.id}')`
                  : `suppressHeadingIdx(${ci})`}"
                title="${ch.fromSection ? t("清除此手動標題（保留頁面）")
                  : t("移除此自動偵測標題 — OCR 誤判 ")
                    + t("（在書籍中降為純文字；保留頁面 OCR 結果；可復原）")}"
                >✕</button>
            </div></li>`).join("")}
        </ol>` : T`<div class="meta">尚無章節。${toc.length ? ""
          : t(" 未偵測到印刷目錄頁 — 請在下方新增章節，或於「頁面」分頁指定章節標題。")}</div>`}
      </div>
      <div class="card">
        <h2>新增章節</h2>
        <div class="meta" style="margin-bottom:.5rem">選擇章節起始頁面並輸入標題。</div>
        <div class="row" style="gap:.5rem">
          <select id="addch-page" style="margin:0">${pageOpts}</select>
          <input id="addch-title" placeholder="章節標題" style="flex:1;margin:0"
            onkeydown="if(event.key==='Enter')addChapter()">
          <button onclick="addChapter()">新增</button>
        </div>
      </div>
      ${window._hiddenHeadings.length ? T`<div class="card">
        <h2>已隱藏標題 <span class="meta">— 您移除的自動偵測誤判標題</span></h2>
        <div class="meta" style="margin-bottom:.4rem">已在產生的書籍中降為純文字；若實際上為章節可予以還原。</div>
        <ul style="margin:.2rem 0;padding-left:1.2rem">${window._hiddenHeadings.map((h, hi) =>
          T`<li style="margin:.2rem 0">${esc(h.title)}
            <span class="meta">(${h.pageId})</span>
            <button class="secondary" style="padding:.1rem .5rem;font-size:.7rem"
              onclick="restoreHeadingIdx(${hi})">還原</button></li>`).join("")}</ul>
      </div>` : ""}
      ${toc.length ? T`<div class="card">
        <h2>印刷目錄頁 <span class="meta">— OCR 辨識結果，供參考</span></h2>
        <ul class="meta" style="columns:2;column-gap:2rem">${toc.map(e =>
          `<li>${esc(e.title)} — ${e.start}</li>`).join("")}</ul>
      </div>` : ""}`;
  } else if (tab === "figures") {
    // real duplicates (same image captured twice) are told from distinct
    // figures on one page by perceptual hash — not by page number
    api(`/projects/${name}/figures/duplicate-clusters`)
      .then(d => renderFiguresTab(p, d.clusters || []))
      .catch(() => renderFiguresTab(p, []));
  } else if (tab === "proof") {
    const sevColor = {high: "#dc2626", medium: "#d97706", low: "#78716c"};
    const findingHtml = (f, ci, fi) => T`
      <div style="border-top:1px solid var(--line);padding:.45rem 0;font-size:.85rem${
          f.rejected ? ";opacity:.55" : ""}">
        <span style="color:${sevColor[f.severity] || "#78716c"}">●</span>
        <b>${esc(f.type)}</b>
        ${f.page ? T` · <a href="javascript:void(0)"
            onclick="gotoPage('${f.page}')">${f.printed_number != null
              ? t("第 ") + f.printed_number + t(" 頁") : f.page}</a>
          <button class="secondary" style="padding:.05rem .5rem;font-size:.7rem"
            title="在浮動面板中開啟頁面影像以與引文進行對照"
            onclick="peekPage('${f.page}')">👁 檢視頁面</button>` : ""}
        ${f.source === "lint" ? t(' · <span class="meta">自動檢查</span>') : ""}
        <div style="font-family:ui-monospace,monospace;font-size:.78rem;margin:.15rem 0">
          “${esc(f.quote)}”${f.replacement != null
            ? ` → <span style="${f.rejected ? "text-decoration:line-through" : ""}">“${esc(f.replacement)}”</span>` : ""}
          ${f.user_edit ? t(' <span class="badge ok">自訂修改</span>') : ""}
          ${f.quote ? T` <button class="secondary" style="padding:.05rem .5rem;font-size:.7rem"
              title="自行填寫或調整修改後的文字 — 僅套用於校對層，頁面 OCR 文字保持不變"
              onclick="editFix(${ci}, ${fi})">✎ ${f.replacement != null ? t("編輯修改") : t("撰寫修改")}</button>` : ""}
          ${f.page ? T` <button class="secondary"
              style="padding:.05rem .5rem;font-size:.7rem"
              title="讓視覺模型直接從頁面相片中重新辨識此段落" onclick="resolveFinding(${ci}, ${fi}, this)">🔎 重新辨識頁面</button>` : ""}
          ${f.replacement == null
            ? t(' <span class="meta">— 附註：✎ 在此撰寫修改，或若拍攝畫面本身有問題請使用頁面連結</span>')
            : f.rejected
            ? T` <span style="color:#78716c">已復原</span>
                <button class="secondary" style="padding:.05rem .5rem;font-size:.7rem"
                  onclick="toggleFinding(${ci}, ${fi}, true)">套用</button>`
            : f.applied
            ? T` <span style="color:#166534">✓ 已套用至校對本</span>
                <button class="secondary" style="padding:.05rem .5rem;font-size:.7rem"
                  title="僅復原此項修改"
                  onclick="toggleFinding(${ci}, ${fi}, false)">復原</button>`
            : (f.skip_reason || "").startsWith("ambiguous")
            ? T` <span style="color:#b45309">引文出現了 ${f.skip_reason.split(":")[1]} 次 —
                  未自動套用</span>
                <button style="padding:.05rem .5rem;font-size:.7rem"
                  onclick="toggleFinding(${ci}, ${fi}, true, true)">套用至全部
                  ${f.skip_reason.split(":")[1]} 處</button>`
            : (f.skip_reason || "").startsWith("unsafe")
            ? T` <span style="color:#dc2626">暫緩處理：${esc(f.skip_reason.slice(7))} —

            : f.skip_reason === "reference"
            ? T` <span style="color:#b45309">參考資料內容 — 請與頁面對照確認，然後</span>
                <button style="padding:.05rem .5rem;font-size:.7rem"
                  onclick="toggleFinding(${ci}, ${fi}, true, true)">套用</button>`

        </div>
        ${f.note ? `<div class="meta" style="margin:0">${esc(f.note)}</div>` : ""}
        <div id="fixed-${ci}-${fi}" style="display:none;margin:.35rem 0 0">
          <textarea id="fixta-${ci}-${fi}" style="min-height:64px;font-size:.8rem"

          <div class="row" style="margin-top:.25rem">
            <button style="padding:.3rem .8rem;font-size:.8rem"

            <button class="secondary" style="padding:.3rem .8rem;font-size:.8rem"
              onclick="$('fixed-${ci}-${fi}').style.display='none'">取消</button>
            <span class="meta" style="margin:0">編輯為書籍應呈現的內容 —
              留空將刪除引文文字；頁面 OCR 永遠不會被修改</span>
          </div>
        </div>

    const chCard = (c, d) => {

      // page-anchored findings that still need a fix — re-reading the page image
      // can often resolve them automatically
      const stuck = (d?.findings || []).filter(f =>
        f.page && !f.applied && !f.rejected && (f.replacement == null || f.skip_reason));
      return T`<div class="card">
        <div class="row">

          <span class="meta" style="margin:0">${(c.chars / 1000).toFixed(1)}k 字${
            c.findings != null
              ? T` · ${c.findings} 個發現 · ${c.applied} 個自動套用` : ""}${
            c.heavy ? t(' · <span style="color:#b45309">⚠ 大幅變更 — 請仔細審閱</span>') : ""}</span>
          <span class="row" style="margin-left:auto">
            ${stuck.length && c.status !== "stale" ? T`<button class="secondary"
              onclick="rereadChapter(${c.idx}, this)" title="直接從頁面影像重新辨識此章節 ${stuck.length} 個未解決的頁面關聯發現；安全的修改將自動套用"
              >🔎 重新辨識 ${stuck.length} 個卡住項目</button>` : ""}
            ${c.status === "stale" ? T`<button onclick="refreshProof(${c.idx}, this)"
              title="將現有修改重新套用至更新後的文字 — 不會呼叫模型">↻ 重新整理</button>` : ""}
            <button class="secondary" onclick="runProof(${c.idx}, this)">
              ${c.status === "unproofed" ? t("校對") : t("重新執行")}</button>
            ${c.status === "review" || c.status === "rejected"
              ? T`<button onclick="reviewProof(${c.idx}, true)">接受</button>` : ""}
            ${c.status === "review" || c.status === "accepted"
              ? T`<button class="secondary" onclick="reviewProof(${c.idx}, false)">拒絕</button>` : ""}
          </span>
        </div>
        ${c.status === "stale" ? T`<div class="meta" style="color:#b45309;margin:.3rem 0 0">
           章節文字在此次校對後已有變更。若僅是重新建置（標記、重排、標題），點擊 <b>↻ 重新整理</b> 即可立即重新套用您的修改 —
           僅在用語文字實際變更時才需要 <b>重新執行</b>。</div>` : ""}
        ${c.status === "accepted" ? T`<div class="meta" style="color:#166534;margin:.3rem 0 0">
           已接受 — 下次建置 EPUB/PDF 時將使用此校對後的文字</div>`
         : c.status === "review" ? T`<div class="meta" style="margin:.3rem 0 0">
           審閱中 — 在您接受之前，建置將繼續使用未校對的文字</div>` : ""}
        ${d && d.findings?.length
          ? `<div style="margin-top:.5rem">${d.findings.map((f, fi) =>
              findingHtml(f, c.idx, fi)).join("")}</div>`
          : d ? T`<div class="meta" style="margin-top:.4rem">無問題 — 沒有發現</div>` : ""}
      </div>`;
    };
    api(`/projects/${name}/proof`).then(async r => {
      if (r.needs_pipeline) {
        body.innerHTML = T`<div class="card" style="text-align:center;padding:2rem">
          <h2 style="margin-top:0">尚無內容可校對</h2>
          <p class="meta">此書尚未辨識文字。校對是針對處理流程產生的書籍文字進行 — 請先執行處理流程。</p>
          <button style="font-size:1rem;padding:.6rem 1.3rem"
            onclick="openProject(current,'pipeline')">→ 前往處理流程</button>
        </div>`;
        return;
      }
      const chs = r.chapters;
      const details = await Promise.all(chs.map(c =>
        c.status === "unproofed" ? null
          : api(`/projects/${name}/proof/${c.idx}`).catch(() => null)));
      body.innerHTML = T`<div class="card">

async function runPipeline() {
  const prov = $("provider").value;
  // a pipeline can run for hours — offer a browser notification for when it's done
  try { if (window.Notification && Notification.permission === "default")
          Notification.requestPermission(); } catch {}
  await api(`/projects/${current}/run` + (prov ? `?provider=${prov}` : ""), {method:"POST"});
  $("runbtn").disabled = true; $("runbtn").textContent = t("執行中…");
  attachEvents(current);
  startProgress(current);
}

let progressTimer = null;
let _wasRunning = {};   // per-project, to fire a "done" notification on the edge
function startProgress(name) {
  clearInterval(progressTimer);
  const tick = async () => {
    let p;
    try { p = await api(`/projects/${name}/progress`); } catch { return; }
    if (name !== current) { clearInterval(progressTimer); return; }
    // notify when a pipeline we saw running has just finished (opt-in; only if
    // the tab is in the background, so it doesn't nag while you're watching)
    if (_wasRunning[name] && !p.running) {
      if (document.hidden && window.Notification && Notification.permission === "granted")
        new Notification("FlipScan", {body: T`處理流程已完成 — ${p.book_title || name}`});
      const s = $("global-status"); if (s) { s.style.display = "block";
        s.textContent = t("✓ 處理流程已完成"); setTimeout(() => s.style.display = "none", 6000); }
    }
    _wasRunning[name] = !!p.running;
    const chip = $("global-status");
    if (chip) {
      if (p.running) {
        chip.style.display = "block";
        chip.textContent = p.detail && p.detail.total
          ? `⚙ ${p.current} ${Math.round(100 * p.detail.done / p.detail.total)}%`
            + (p.eta_seconds > 90 ? T` · ~${Math.round(p.eta_seconds / 60)} 分鐘`
               : p.eta_seconds != null ? T` · ~${p.eta_seconds} 秒` : "")
          : `⚙ ${p.current ? lbl(p.current) : t("執行中")}…`;
      } else {
        chip.style.display = "none";
      }
    }
    const rb = $("runbtn");
    if (rb) {
      rb.disabled = p.running;
      rb.textContent = p.running ? t("執行中…") : t("執行 / 繼續");
    }
    // live stage chips
    for (const [s, st] of Object.entries(p.stages)) {
      const el = $("stage-" + s);
      if (el) el.className = "stage " + st + (s === p.current && p.running ? " active" : "");
    }
    const box = $("progress");
    if (!box) return;
    if (p.running && p.detail && p.detail.total) {
      box.style.display = "block";
      const pct = Math.round(100 * p.detail.done / p.detail.total);
      $("pfill").style.width = pct + "%";
      $("ptext").textContent =
        `${lbl(p.current)}: ${p.detail.done} / ${p.detail.total} ${lbl(p.detail.unit)} (${pct}%)`;
      $("peta").textContent = p.eta_seconds == null ? "" :
        p.eta_seconds > 90 ? T`剩餘約 ${Math.round(p.eta_seconds / 60)} 分鐘`
                           : T`剩餘約 ${p.eta_seconds} 秒`;
    } else if (p.running) {
      box.style.display = "block";
      $("pfill").style.width = "100%";
      $("ptext").textContent = p.current ? T`${p.current}: 處理中…` : t("啟動中…");
      $("peta").textContent = "";
    } else {
      box.style.display = "none";  // keep polling: a run may start elsewhere
    }
  };
  tick();
  progressTimer = setInterval(tick, 4000);
}

let logStream = null;   // only ever one open log stream
function attachEvents(name) {
  const log = $("log");
  log.style.display = "block";
  if (logStream) logStream.close();   // re-visiting the tab must not stack streams
  const es = logStream = new EventSource(`/api/projects/${name}/events`);
  es.onmessage = (e) => {
    log.textContent += JSON.parse(e.data) + "\n";
    log.scrollTop = log.scrollHeight;
  };
  es.addEventListener("done", () => { es.close(); openProject(name); refreshProjects(); });
  es.onerror = () => es.close();
}

// reflow hard-wrapped prose in the editor (a split-recovered second column
// often comes back line-for-line) — fills the editor with the flowed text and
// marks it dirty so the user reviews it, then hits Save markdown
async function reflowMd(pageId) {
  const el = $("md-" + pageId);
  if (!el) return;
  let r;
  try {
    r = await api(`/projects/${current}/pages/${pageId}/reflow`, {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({markdown: el.value})});
  } catch (e) { alert(t("重新排列文字失敗: ") + e.message); return; }
  if (r.markdown === el.value) {
    const b = $("mdsave-" + pageId);
    if (b) { const prev = b.textContent; b.textContent = t("文字已重新排列 ✓");
             setTimeout(() => b.textContent = prev, 1400); }
    return;
  }
  el.value = r.markdown;
  el.dataset.dirty = 1;
  const b = $("mdsave-" + pageId);
  if (b) { b.textContent = t("儲存 Markdown *"); b.disabled = false; }
}

async function saveMd(pageId) {
  const btn = $("mdsave-" + pageId);
  try { await api(`/projects/${current}/pages/${pageId}/md`, {
    method:"PUT", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({markdown: $("md-" + pageId).value})}); } catch (e) { alert(t('儲存失敗: ') + e.message); return; }
  delete $("md-" + pageId).dataset.dirty;
  if (btn) {
    btn.textContent = t("✓ 已儲存");
    btn.disabled = true;
    setTimeout(() => { btn.textContent = t("儲存 Markdown"); btn.disabled = false; }, 1800);
  }
}

async function patchPage(pageId) {

async function addVideoToProject() {
  const input = $("addvideo-file");
  if (!input.files.length) return;
  const btn = input.nextElementSibling;
  btn.disabled = true;
  const fd = new FormData();
  fd.append("video", input.files[0]);
  try {
    const up = await uploadXHR(`/api/projects/${current}/videos`, fd,
                    pct => btn.textContent = pct < 100 ? T`上傳中 ${pct}%` : t("處理中…"));
    const j = await waitForJob(up.job_id, line => btn.textContent = line.slice(0, 40));
    const vid = j.result && j.result.id;
    // orientation: auto-detected during processing unless the user knows
    const o = prompt(
      t("影片已新增。\n\n影片是否上下顛倒？\n") +
      t("  a = 自動偵測（建議 — 處理期間檢查）\n") +
      t("  y = 是，上下顛倒\n") +
      t("  n = 否，方向正常"), "a");
    if (o && vid) {
      const v = o.trim().toLowerCase();
      if (v === "y") await api(`/projects/${current}/videos/${vid}?rotate=180`,
                               {method: "PUT"});
      else if (v === "n") await api(`/projects/${current}/videos/${vid}?rotate=0`,
                                    {method: "PUT"});
      // "a" (or anything else): leave unset — preprocess auto-detects
    }
    if (confirm(t("是否立即執行處理流程以合併其頁面？"))) {
      await api(`/projects/${current}/run`, {method:"POST"});
    }
  } catch (e) { alert(t("新增影片失敗: ") + e.message); }
  openProject(current, "media");
}

async function previewVoice(voice, character, btn) {

// in-browser voice recording for cloning (MediaRecorder; mic access needs
// localhost or HTTPS — from a phone over the LAN, use the file upload instead)
let vrec = null;   // {rec, stream, chunks, blob, t0, timer}
let voiceTarget = "";   // cast character to auto-assign the saved voice to
function openVoiceRecorder(forCharacter = "") {
  voiceTarget = forCharacter;
  $("voice-modal").style.display = "flex";
  const nameEl = $("vrec-name");
  if (forCharacter && nameEl && !nameEl.value) nameEl.value = forCharacter;
  const note = $("vrec-note");
  if (forCharacter && note)
    note.textContent = T`將自動指派為「${forCharacter}」的角色配音`;
  if (!navigator.mediaDevices?.getUserMedia) {
    // plain-http on the LAN: browsers block the mic. The server also listens
    // on https at port+1 — send the user there (one-time cert warning).
    const httpsUrl = `https://${location.hostname}:${(+location.port || 80) + 1}${location.pathname}${location.hash}`;
    note.innerHTML = T`麥克風需要 HTTPS：<a href="${httpsUrl}">切換至安全位址</a>（接受一次憑證警告）— 或 📁 上傳`;
  }
}
function closeVoiceRecorder() {
  voiceTarget = "";
  if (vrec?.rec?.state === "recording") vrec.rec.stop();
  vrec?.stream?.getTracks().forEach(tr => tr.stop());
  clearInterval(vrec?.timer);
  vrec = null;
  $("voice-modal").style.display = "none";
}
async function toggleVoiceRec() {
  const btn = $("vrec-btn");
  if (vrec?.rec?.state === "recording") { vrec.rec.stop(); return; }
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia(
      {audio: {echoCancellation: false, noiseSuppression: true}});
  } catch (e) { alert(t("麥克風無法使用：") + e.message); return; }
  const rec = new MediaRecorder(stream);
  vrec = {rec, stream, chunks: [], blob: null, t0: Date.now(), timer: null};
  rec.ondataavailable = e => vrec.chunks.push(e.data);
  rec.onstop = () => {
    clearInterval(vrec.timer);
    vrec.stream.getTracks().forEach(tr => tr.stop());
    vrec.blob = new Blob(vrec.chunks, {type: rec.mimeType || "audio/webm"});
    const a = $("vrec-audio");
    a.src = URL.createObjectURL(vrec.blob);
    a.style.display = "";
    $("vrec-use").style.display = "";
    btn.textContent = t("↺ 重新錄音");
    const secs = (Date.now() - vrec.t0) / 1000;
    $("vrec-note").textContent = secs < 8
      ? t("時間偏短 — 15–30 秒複製效果更佳") : "";
  };
  rec.start();
  btn.textContent = t("■ 停止");
  $("vrec-use").style.display = "none";
  $("vrec-audio").style.display = "none";
  vrec.timer = setInterval(() => {
    const s = Math.floor((Date.now() - vrec.t0) / 1000);
    $("vrec-timer").textContent =
      `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`
      + (s >= 15 && s <= 35 ? " ✓" : "");
    if (s >= 40) vrec.rec.stop();   // the engine only uses the first ~30 s
  }, 250);
}

function startUnidentifiedWizard() {
  const items = (window._proj.pages || [])
    .filter(pg => !pg.role && !["duplicate", "deleted", "patched"].includes(pg.status)
                  && (pg.printed_number == null || pg.printed_number < 1)
                  && (pg.reasons || []).length)
    .map(pg => ({kind: "reshoot", page_id: pg.id, color: pg.color,
                 label: pg.id, reasons: pg.reasons}));
  if (!items.length) { alert(t("沒有未辨識的問題頁面 — 太棒了。")); return; }
  wiz = {items, i: 0, done: 0, mode: "unidentified"};
  renderWizard();
}

function renderWizard() {
  const it = wiz.items[wiz.i];
  if (!it) { return finishWizard(); }
  const preview = wiz.mode === "unidentified" ? it.color : it.preview;
  const img = preview ? `
    <img decoding="async" src="/api/projects/${current}/thumb/${preview}?w=900${fv(preview)}"
         style="max-height:45vh;border:1px solid var(--line);border-radius:6px;
                margin-bottom:1rem">` : "";
  const title = wiz.mode === "unidentified"
    ? t("在書中找到此頁") : `📖 ${esc(it.label)}`;
  $("main").innerHTML = T`
  <div class="card" style="max-width:34rem;margin:0 auto;text-align:center">
    <div class="meta">${wiz.mode === "unidentified" ? t("未辨識頁面") : t("補拍")}
      精靈 · 第 ${wiz.i + 1} 項，共 ${wiz.items.length} 項 · 已處理 ${wiz.done} 項</div>
    <h2 style="font-size:${wiz.mode === "unidentified" ? "1.4" : "2.2"}rem;
        margin:.6rem 0">${title}</h2>
    <div class="meta" style="margin-bottom:1rem">${esc(it.reasons.join(", "))}</div>
    <div class="ptrack" style="margin-bottom:1.2rem"><div class="pfill"
         style="width:${Math.round(100 * wiz.i / wiz.items.length)}%"></div></div>
    ${img}
    <input type="file" accept="image/*" capture="environment" id="wiz-file"
           style="display:none" onchange="wizardShot()">
    <button style="font-size:1.3rem;padding:1rem 2.2rem;width:100%"
            onclick="$('wiz-file').click()" id="wiz-btn">📷 拍照</button>
    <div class="row" style="margin-top:1rem;justify-content:center">
      ${wiz.mode === "unidentified" ? T`<button class="danger"
         onclick="wizardHide()">無效內容 — 隱藏</button>` : ""}
      <button class="secondary" onclick="wiz.i++; renderWizard()">略過</button>
      <button class="secondary" onclick="finishWizard()">完成</button>
    </div>
    <div class="meta" style="margin-top:1rem">${wiz.mode === "unidentified"
      ? t("參考上方的拍攝畫面找到該頁面並平整拍攝 — 若非實際頁面（如翻頁中、桌面等）請直接隱藏。")
      : t("將書本平放，讓頁面填滿畫面並確保印刷頁碼清晰可見。照片會加入佇列 — 完成後將一次執行辨識。")}</div>
  </div>`;
}

async function wizardHide() {
  const it = wiz.items[wiz.i];
  try { await api(`/projects/${current}/pages/${it.page_id}`, {method:"DELETE"}); }
  catch (e) { alert(t("隱藏失敗：") + e.message); return; }
  wiz.done++;
  wiz.i++;
  renderWizard();
}

async function wizardShot() {
  const input = $("wiz-file");
  if (!input.files.length) return;
  const it = wiz.items[wiz.i];
  const btn = $("wiz-btn");
  btn.disabled = true;
  const fd = new FormData();
  fd.append("photo", input.files[0]);
  const params = it.kind === "missing"
    ? `kind=missing&number=${it.number}`
    : it.kind === "figure"
    ? `kind=figure&page_id=${it.page_id}&fig_idx=${it.fig_idx}`
    : `kind=reshoot&page_id=${it.page_id}`
      + (it.number != null ? `&number=${it.number}` : "");
  try {
    await uploadXHR(`/api/projects/${current}/capture?${params}`, fd,
                    pct => btn.textContent = T`上傳中 ${pct}%`);
    wiz.done++;
    wiz.i++;
    renderWizard();
  } catch (e) {
    alert(t("補拍失敗：") + e.message);
    btn.disabled = false;
    btn.textContent = t("📷 拍照");
  }
}

async function finishWizard() {
  const done = wiz?.done || 0;
  wiz = null;
  if (done && confirm(T`已拍攝 ${done} 頁。現在要執行處理流程進行辨識嗎？`)) {
    await api(`/projects/${current}/run`, {method:"POST"});
  }
  openProject(current);
}

async function gotoPage(pageId) {
  await openProject(current, "pages");
  let el = document.getElementById("cell-" + pageId);
  if (!el) {
    // the active section/unnumbered filter hides this page — switch the
    // filter to the section that contains it
    const pg = (window._proj?.pages || []).find(x => x.id === pageId);
    chapterFilter = pg?._chapter || "";
    pageFilters.unnumbered = false;
    renderTab("pages", window._proj);
    el = document.getElementById("cell-" + pageId);
  }
  if (!el) return;
  el.style.outline = "3px solid var(--accent)";
  setTimeout(() => el.style.outline = "", 3000);
  // images above the cell finish loading after we jump and push it away —
  // keep re-pinning until layout settles or the user takes over scrolling
  const main = $("main");
  let userScrolled = false;
  const takeOver = () => userScrolled = true;
  main.addEventListener("wheel", takeOver, {passive: true});
  main.addEventListener("touchmove", takeOver, {passive: true});
  el.scrollIntoView({block: "start"});
  const t0 = performance.now();
  (function pin() {
    if (userScrolled || performance.now() - t0 > 2500) {
      main.removeEventListener("wheel", takeOver);
      main.removeEventListener("touchmove", takeOver);
      return;
    }
    const drift = el.getBoundingClientRect().top - main.getBoundingClientRect().top;
    if (Math.abs(drift) > 2) el.scrollIntoView({block: "start"});
    requestAnimationFrame(pin);
  })();
}

function toggleCell(pageId) {

let pageFilters = {unnumbered: false};
// The chapter filter is SHARED by the pages and figures tabs: pick a chapter in
// one and the other shows the same slice when you open it. Loop-free BY DESIGN —
// each tab's dropdown re-renders ONLY its own tab, never the other, so there is
// no back-and-forth render cascade; the two sync lazily on tab switch.
let chapterFilter = "";
function freshFiltersFor(name) {   // reset filters when the project changes
  if (window._filterProj !== name) {
    chapterFilter = "";
    pageFilters = {unnumbered: false};
    window._filterProj = name;
  }
}
let figV = {};   // session bumps (fallback until the next detail fetch)
const fv = (k) => {
  const sv = window._proj?.file_versions?.[k] || 0;
  const b = figV[k] || 0;
  return (sv || b) ? `&v=${sv}.${b}` : "";
};
function bumpFig(k) { figV[k] = (figV[k] || 0) + 1; }

// Reload a single figure's thumbnail(s) in place (new cache-busting version)
// WITHOUT re-rendering the tab — so a re-crop on the figures tab doesn't rebuild
// the list and throw you back to the top. Call bumpFig(figFile) first.
function refreshFigThumb(figFile) {
  document.querySelectorAll("img").forEach(img => {
    const u = img.getAttribute("src") || "";
    if (u.includes(`/thumb/${figFile}?w=`)) {
      const w = (u.match(/[?&]w=(\d+)/) || [])[1] || "380";
      img.src = `/api/projects/${current}/thumb/${figFile}?w=${w}${fv(figFile)}`;
    }
  });
}

// thumbnail width matched to the actual layout: full-width cells on phones,
// the ~340px image column on desktop — halves phone decode memory
function thumbW() {
  const col = innerWidth <= 820 ? innerWidth : 340;   // CSS width of the image
  const px = col * Math.min(1.5, devicePixelRatio || 1);
  return Math.min(760, Math.max(320, Math.ceil(px / 20) * 20));
}

// Poll a durable background job to completion. The work runs on the server
// worker, so closing the tab or a network blip no longer kills it — reopening
// and calling waitForJob again just resumes watching. Returns the job (with
// its .result); throws on error/cancel.
async function waitForJob(jobId, onLine) {
  let after = 0;
  while (true) {
    let j, ls;
    try {
      j = await api(`/jobs/${jobId}`);
      ls = (await api(`/jobs/${jobId}/logs?after=${after}`)).logs;
    } catch (e) { await new Promise(r => setTimeout(r, 1500)); continue; }
    for (const l of ls) { after = l.id; if (onLine) onLine(l.line); }
    if (j.status === "done") return j;
    if (j.status === "error") throw new Error(j.error || t("工作失敗"));
    if (j.status === "canceled") throw new Error("canceled");
    await new Promise(r => setTimeout(r, 1000));
  }
}

let peekZoom = 1;
function peekPage(pageId) {
  const pg = (window._proj?.pages || []).find(x => x.id === pageId);
  if (!pg || !pg.color) { alert(t("此頁面尚未有處理後的影像")); return; }
  let pane = $("page-peek");
  if (!pane) {
    pane = document.createElement("div");
    pane.id = "page-peek";
    pane.innerHTML = T`
      <div id="peek-head">
        <b id="peek-title" style="flex:1;white-space:nowrap;overflow:hidden;
           text-overflow:ellipsis"></b>
        <button onclick="peekZoomBy(-1)" title="縮小">−</button>
        <button onclick="peekZoomBy(1)" title="放大">+</button>
        <button onclick="$('page-peek').style.display='none'" title="關閉">✕</button>
      </div>
      <div id="peek-body"><img id="peek-img"></div>`;
    document.body.appendChild(pane);
    const head = $("peek-head");
    let dx = 0, dy = 0;
    head.addEventListener("pointerdown", (e) => {
      if (e.target.tagName === "BUTTON") return;
      const r = pane.getBoundingClientRect();
      dx = e.clientX - r.left; dy = e.clientY - r.top;
      pane.style.right = "auto";
      head.setPointerCapture(e.pointerId);
      const move = (ev) => {
        pane.style.left = Math.max(0, Math.min(innerWidth - 60, ev.clientX - dx)) + "px";
        pane.style.top = Math.max(0, Math.min(innerHeight - 40, ev.clientY - dy)) + "px";
      };
      const up = () => { head.removeEventListener("pointermove", move);
                         head.removeEventListener("pointerup", up); };
      head.addEventListener("pointermove", move);
      head.addEventListener("pointerup", up);
    });
  }
  peekZoom = 1;
  $("peek-title").textContent =
    (pg.printed_number != null ? t("頁面 ") + pg.printed_number : pg.id) + " · " + pg.id;
  const img = $("peek-img");
  img.style.width = "100%";
  img.src = `/api/projects/${current}/thumb/${pg.color}?w=1100${fv(pg.color)}`;
  pane.style.display = "block";
  pane.style.top = "4rem";
  pane.style.right = "1rem";
  pane.style.left = "auto";
}
function peekZoomBy(dir) {
  peekZoom = Math.max(1, Math.min(4, peekZoom + dir * 0.5));
  const img = $("peek-img");
  if (img) img.style.width = (peekZoom * 100) + "%";
}
